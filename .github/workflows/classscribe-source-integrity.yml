name: ClassScribe source integrity

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  # Repository branch rules require this check name; keep it stable.
  classscribe-source-integrity:
    name: classscribe-source-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Verify protected website source
        run: pnpm check:classscribe-source-integrity

  /edu/access:
    get:
      operationId: getEduAccess
      tags: [courses]
      summary: Get the signed-in user's EDU access capabilities
      description: Reports whether this Clerk session must verify EDU client credentials and the capabilities granted by its verified agreement.
      responses:
        "200":
          description: Minimal EDU access capabilities
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EduAccessStatus" }
  /edu/activate:
    post:
      operationId: activateEduAccess
      tags: [courses]
      summary: Verify EDU license number and client PIN for this Clerk session
      description: Activates only the signed-in user's current Clerk session. Does not grant an operator license or instructor role.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EduClientActivationInput" }
      responses:
        "200":
          description: EDU client credentials verified for this Clerk session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EduClientActivationStatus" }
        "401": { description: A valid Clerk session is required }
        "403": { description: EDU client credentials are invalid or inactive }
        "429": { description: Persistent account or IP lockout is active }
        "503": { description: EDU credential verification is temporarily unavailable }
  /edu/school:
    get:
      operationId: getEduSchool
      tags: [courses]
      summary: List instructors approved under the signed-in school administrator's active agreement
      responses:
        "200":
          description: School agreement and instructor approvals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EduSchool" }
        "403": { description: Not an active school administrator }
  /edu/school/instructor-history:
    get:
      operationId: getEduInstructorHistory
      tags: [courses]
      summary: Read approval and revocation history for the administrator's current active agreement
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          description: Last event ID from the previous page, belonging to the current agreement
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Newest-first audit events with a continuation cursor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EduInstructorHistoryPage" }
        "400": { description: Invalid pagination parameters or cursor }
        "401": { description: A valid Clerk session is required }
        "403": { description: Not an active school administrator }
        "503": { description: History is temporarily unavailable }
  /edu/school/instructors:
    post:
      operationId: approveEduInstructor
      tags: [courses]
      summary: Approve an existing Clerk account under the administrator's agreement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EduInstructorApprovalInput" }
      responses:
        "201":
          description: Instructor approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EduInstructor" }
        "403": { description: Not an active school administrator }
        "409": { description: Instructor belongs to another agreement }
  /edu/school/expiry-warning:
    patch:
      operationId: updateEduExpiryWarning
      tags: [courses]
      summary: Opt in or out of the school page warning 30 days before the verified agreement expires
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EduExpiryWarningInput" }
      responses:
        "200":
          description: Saved in-app warning preference; does not renew or extend access
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EduExpiryWarning" }
        "400": { description: Invalid warning preference }
        "403": { description: Not an active school administrator }
  /edu/school/instructors/{userId}:
    delete:
      operationId: revokeEduInstructor
      tags: [courses]
      summary: Revoke one instructor's access without deleting their courses
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Instructor revoked }
        "403": { description: Not an active school administrator }
        "404": { description: Instructor is not an active member of this school }
  /edu/courses/{id}/gradebook:
    get:
      operationId: getEduGradebook
      tags: [courses]
      summary: Get an EDU course gradebook
      description: Available to the signed-in course instructor and enrolled students. Instructors see the enrolled roster and each student's grades; students see only their own row. Access requires the course owner's active EDU license.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: EDU assignments, permitted student grade rows, and counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EduGradebook" }
        "401": { description: Clerk authentication required }
        "403": { description: Course instructor's EDU license is not active }
        "404": { description: EDU course is unavailable to this user }
        "500": { description: Gradebook could not be loaded }
        "503": { description: EDU access verification is temporarily unavailable }
  /edu/courses/{id}/gradebook/export:
    get:
      operationId: exportEduGradebook
      tags: [courses]
      summary: Download an instructor-only course gradebook CSV
      description: Requires the signed-in course owner and active matching EDU credentials. One row per enrolled student, with assignment points, scores, missing/ungraded statuses, and graded-only totals. Missing and ungraded work do not count as zero. CSV text is escaped for spreadsheet safety; the response must not be cached.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: UTF-8 CSV attachment, including headers for an empty roster
          content:
            text/csv:
              schema: { type: string }
        "401": { description: Clerk authentication required }
        "403": { description: Not the course instructor or inactive EDU credentials }
        "404": { description: EDU course is unavailable to this user }
        "500": { description: Gradebook could not be exported }
        "503": { description: EDU access verification is temporarily unavailable }
  /edu/courses/{id}/discussions:
    get:
      operationId: listEduDiscussionTopics
      tags: [collaboration]
      summary: List paginated EDU discussion topics
      description: Available to the signed-in course instructor and enrolled students when the course owner's EDU license is active.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          description: Number of topics to return (default 50; maximum 100).
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          required: false
          description: Number of topics to skip (default 0).
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Topics ordered newest first, with the effective pagination values
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EduDiscussionTopicList" }
        "400": { description: Invalid pagination; limit must be 1–100 and offset a non-negative integer }
        "401": { description: Clerk authentication required }
        "403": { description: Course instructor's EDU license is not active }
        "404": { description: EDU course is unavailable to this user }
        "500": { description: Discussions could not be loaded }
        "503": { description: EDU access verification is temporarily unavailable }
    post:
      operationId: createEduDiscussionTopic
      tags: [collaboration]
      summary: Create an EDU discussion topic
      description: Any authenticated instructor or enrolled student may create a topic in an accessible EDU course with an active owner license.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EduDiscussionTopicInput" }
      responses:
        "201":
          description: Created discussion topic
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EduDiscussionTopicResult" }
        "400": { description: Title or body is missing or exceeds its length limit }
        "401": { description: Clerk authentication required }
        "403": { description: Course instructor's EDU license is not active }
        "404": { description: EDU course is unavailable to this user }
        "500": { description: Discussion topic could not be created }
        "503": { description: EDU access verification is temporarily unavailable }
  /edu/courses/{id}/discussions/{topicId}/replies:
    get:
      operationId: listEduDiscussionReplies
      tags: [collaboration]
      summary: List paginated replies to an EDU discussion topic
      description: Available to the signed-in course instructor and enrolled students when the course owner's EDU license is active.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: topicId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          description: Number of replies to return (default 50; maximum 100).
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          required: false
          description: Number of replies to skip (default 0).
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Replies ordered oldest first, with the effective pagination values
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EduDiscussionReplyList" }
        "400": { description: Invalid pagination; limit must be 1–100 and offset a non-negative integer }
        "401": { description: Clerk authentication required }
        "403": { description: Course instructor's EDU license is not active }
        "404": { description: EDU course or discussion topic is unavailable to this user }
        "500": { description: Discussion replies could not be loaded }
        "503": { description: EDU access verification is temporarily unavailable }
    post:
      operationId: createEduDiscussionReply
      tags: [collaboration]
      summary: Reply to an unlocked EDU discussion topic
      description: Any authenticated instructor or enrolled student may reply to an unlocked topic in an accessible EDU course with an active owner license.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: topicId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EduDiscussionReplyInput" }
      responses:
        "201":
          description: Created discussion reply
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EduDiscussionReplyResult" }
        "400": { description: "Reply body is missing or exceeds 10,000 characters" }
        "401": { description: Clerk authentication required }
        "403": { description: Course instructor's EDU license is not active }
        "404": { description: EDU course or discussion topic is unavailable to this user }
        "409": { description: Discussion topic is locked }
        "500": { description: Discussion reply could not be created }
        "503": { description: EDU access verification is temporarily unavailable }
  /edu/courses/{id}/discussions/{topicId}:
    patch:
      operationId: updateEduDiscussionTopic
      tags: [collaboration]
      summary: Update an EDU discussion topic or its lock state
      description: The topic creator may edit its title or body; only the course instructor may lock or unlock it. Instructor and creator access requires an active course-owner EDU license.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: topicId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EduDiscussionTopicUpdate" }
      responses:
        "200":
          description: Updated discussion topic
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EduDiscussionTopicResult" }
        "400": { description: No valid fields supplied or title/body is invalid }
        "401": { description: Clerk authentication required }
        "403": { description: Only the course instructor can lock or unlock a topic }
        "404": { description: Topic unavailable to this user or course }
        "500": { description: Discussion topic could not be updated }
        "503": { description: EDU access verification is temporarily unavailable }
    delete:
      operationId: deleteEduDiscussionTopic
      tags: [collaboration]
      summary: Delete an EDU discussion topic
      description: The topic creator or course instructor may delete it; deleting a topic also removes its replies. Access requires an active course-owner EDU license.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: topicId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Topic and its replies deleted }
        "401": { description: Clerk authentication required }
        "403": { description: Course instructor's EDU license is not active }
        "404": { description: Topic unavailable to this user or course }
        "500": { description: Discussion topic could not be deleted }
        "503": { description: EDU access verification is temporarily unavailable }
  /edu/courses/{id}/discussions/{topicId}/replies/{replyId}:
    patch:
      operationId: updateEduDiscussionReply
      tags: [collaboration]
      summary: Edit an EDU discussion reply
      description: The reply creator or course instructor may edit it in an accessible EDU course with an active owner license.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: topicId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: replyId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EduDiscussionReplyInput" }
      responses:
        "200":
          description: Updated discussion reply
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EduDiscussionReplyResult" }
        "400": { description: "Reply body is missing or exceeds 10,000 characters" }
        "401": { description: Clerk authentication required }
        "403": { description: Course instructor's EDU license is not active }
        "404": { description: Reply unavailable to this user or course }
        "500": { description: Discussion reply could not be updated }
        "503": { description: EDU access verification is temporarily unavailable }
    delete:
      operationId: deleteEduDiscussionReply
      tags: [collaboration]
      summary: Delete an EDU discussion reply
      description: The reply creator or course instructor may delete it. Access requires an active course-owner EDU license.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: topicId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: replyId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Reply deleted }
        "401": { description: Clerk authentication required }
        "403": { description: Course instructor's EDU license is not active }
        "404": { description: Reply unavailable to this user or course }
        "500": { description: Discussion reply could not be deleted }
        "503": { description: EDU access verification is temporarily unavailable }
  /edu/courses/{id}/groups:
    get:
      operationId: listEduGroups
      tags: [collaboration]
      summary: List EDU course groups visible to the signed-in user
      description: Instructors see all course groups; students see only groups they belong to. Course access requires an active EDU license held by the course owner.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Visible course groups
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EduGroupList" }
        "403": { description: Course instructor's EDU license is not active }
        "404": { description: EDU course is unavailable to this user }
    post:
      operationId: createEduGroup
      tags: [collaboration]
      summary: Create a group in an EDU course
      description: Instructor-only; the instructor must own the course and have an active EDU license.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EduGroupInput" }
      responses:
        "201":
          description: Created course group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EduGroupResult" }
        "400": { description: Invalid group name or description }
        "403": { description: Course instructor's EDU license is not active }
        "404": { description: Course unavailable to the instructor }
  /edu/courses/{id}/groups/{groupId}/members:
    put:
      operationId: replaceEduGroupMembers
      tags: [collaboration]
      summary: Replace the enrolled student membership of an EDU group
      description: Instructor-only; every supplied member ID must be an enrolled course member. The course owner is excluded from the resulting memberIds.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: groupId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EduGroupMembersUpdate" }
      responses:
        "200":
          description: Replaced group membership
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EduGroupMembersResult" }
        "400": { description: Invalid memberIds or one or more IDs are not enrolled in the course }
        "403": { description: Course instructor's EDU license is not active }
        "404": { description: Course or group unavailable to the instructor }
  /edu/courses/{id}/lectures:
    get:
      operationId: listEduLectures
      tags: [lectures]
      summary: List EDU lectures visible to the signed-in user
      description: Instructors see all course lectures; students see only lectures shared with one or more of their groups. Returned lecture objects omit private audio storage keys. Course access requires an active owner EDU license.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Visible EDU lectures
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EduLectureList" }
        "403": { description: Course instructor's EDU license is not active }
        "404": { description: EDU course is unavailable to this user }
    post:
      operationId: createEduLecture
      tags: [lectures]
      summary: Create a lecture in an EDU course
      description: Instructor-only; the instructor must own the course and have an active EDU license.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EduLectureInput" }
      responses:
        "201":
          description: Created lecture (private audio object key is omitted)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EduLectureResult" }
        "400": { description: "Invalid title, professor, or lectureDate" }
        "403": { description: Course instructor's EDU license is not active }
        "404": { description: Course unavailable to the instructor }
  /edu/courses/{id}/lectures/{lectureId}:
    patch:
      operationId: updateEduLecture
      tags: [lectures]
      summary: Update EDU lecture metadata
      description: Instructor-only; only title, professor, and lectureDate can be updated.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: lectureId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EduLectureUpdate" }
      responses:
        "200":
          description: Updated lecture (private audio object key is omitted)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EduLectureResult" }
        "400": { description: "Empty update, unsupported field, or invalid metadata" }
        "403": { description: Course instructor's EDU license is not active }
        "404": { description: Course or lecture unavailable to the instructor }
  /edu/courses/{id}/lectures/{lectureId}/share:
    post:
      operationId: shareEduLecture
      tags: [lectures]
      summary: Replace the groups that can access an EDU lecture
      description: Instructor-only. groupIds may be empty to remove all group sharing; every ID must identify a group in this course.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: lectureId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EduLectureShareInput" }
      responses:
        "200":
          description: Replaced group sharing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EduLectureShareResult" }
        "400": { description: groupIds contains a group outside this course or an invalid ID }
        "403": { description: Course instructor's EDU license is not active }
        "404": { description: Course or lecture unavailable to the instructor }
  /edu/courses/{id}/lectures/{lectureId}/transcribe:
    post:
      operationId: transcribeEduLecture
      tags: [openai]
      summary: Securely store and transcribe an EDU lecture recording
      description: Instructor-only. Accepts supported base64 audio up to 20 MB, stores it privately, and persists the transcript/status on the lecture. Limits are four requests per user per minute and one active request per user; at most two requests run concurrently. A failure can leave the recording saved privately for retry.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: lectureId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EduLectureTranscriptionInput" }
      responses:
        "200":
          description: Updated lecture with transcription status and transcript (private audio object key is omitted)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EduLectureResult" }
        "400": { description: "Invalid base64 audio, unsupported MIME type, unsafe filename, or signature mismatch" }
        "403": { description: Course instructor's EDU license is not active }
        "404": { description: Course or lecture unavailable to the instructor }
        "409": { description: A transcription is already in progress }
        "413": { description: Decoded audio exceeds 20 MB }
        "429": { description: Per-user transcription request limit reached or provider rate limit }
        "503": { description: Transcription provider or private object storage is unavailable }
  /edu/courses/{id}/lectures/{lectureId}/audio:
    get:
      operationId: downloadEduLectureAudio
      tags: [lectures]
      summary: Download a privately stored EDU lecture recording
      description: The instructor may download any lecture recording; a student may download it only if the lecture is shared with a group they belong to. The response is private and not cacheable.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: lectureId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Audio file attachment; Content-Type is the stored audio MIME type, Content-Disposition is attachment, and Cache-Control is private, no-store
          headers:
            Content-Type: { schema: { type: string } }
            Content-Disposition: { schema: { type: string } }
            Cache-Control: { schema: { type: string, const: "private, no-store" } }
          content:
            audio/mp4:
              schema: { type: string, format: binary }
            audio/mpeg:
              schema: { type: string, format: binary }
            audio/wav:
              schema: { type: string, format: binary }
            audio/x-wav:
              schema: { type: string, format: binary }
            audio/webm:
              schema: { type: string, format: binary }
            audio/aac:
              schema: { type: string, format: binary }
            audio/ogg:
              schema: { type: string, format: binary }
            application/octet-stream:
              schema: { type: string, format: binary }
        "403": { description: Course instructor's EDU license is not active }
        "404": { description: "EDU course, lecture, or authorized audio is unavailable" }
        "503": { description: Private lecture audio is temporarily unavailable }
  /edu/courses/{id}/sources/links:
    post:
      operationId: createEduSourceLink
      tags: [lectures]
      summary: Add an HTTP(S) link as an EDU course source
      description: Instructor-only. Visibility defaults to private when omitted. Private sources are visible only to instructors; groups sources require one or more valid groupIds from this course and are visible only to students assigned to at least one of those groups; class sources are visible to all enrolled students. groupIds is accepted only with groups visibility.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EduSourceLinkInput" }
      responses:
        "201":
          description: Created link source (private storage object key is omitted)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EduSourceResult" }
        "400": { description: "Invalid title, HTTP(S) URL, description, visibility, groupIds, or visibility/groupIds combination" }
        "403": { description: Course instructor's EDU license is not active }
        "404": { description: Course unavailable to the instructor }
  /edu/courses/{id}/sources/uploads:
    post:
      operationId: uploadEduSource
      tags: [lectures]
      summary: Upload a PDF or plain-text EDU course source
      description: Instructor-only. Accepts base64-encoded PDF or TXT files up to 10 MB. Visibility defaults to private when omitted. Private sources are visible only to instructors; groups sources require one or more valid groupIds from this course and are visible only to students assigned to at least one of those groups; class sources are visible to all enrolled students. groupIds is accepted only with groups visibility.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EduSourceUploadInput" }
      responses:
        "201":
          description: Created upload source (private storage object key is omitted)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EduSourceResult" }
        "400": { description: "Invalid file metadata, base64, content signature, visibility, groupIds, or visibility/groupIds combination" }
        "403": { description: Course instructor's EDU license is not active }
        "404": { description: Course unavailable to the instructor }
        "413": { description: Decoded source file exceeds 10 MB }
        "503": { description: Private source file could not be stored }
  /edu/courses/{id}/sources:
    get:
      operationId: listEduSources
      tags: [lectures]
      summary: List EDU course sources visible to the signed-in user
      description: Instructors see all course sources and receive every groupId assigned to each source. Students see class sources with an empty groupIds array and groups sources only when assigned to one or more of their groups; each student's groupIds contains only their matching groups. Private sources are not returned to students. Private object keys are omitted. Course access requires an active owner EDU license.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Visible EDU sources
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EduSourceList" }
        "403": { description: Course instructor's EDU license is not active }
        "404": { description: EDU course is unavailable to this user }
  /edu/courses/{id}/sources/{sourceId}/download:
    get:
      operationId: downloadEduSource
      tags: [lectures]
      summary: Download a privately stored EDU source upload
      description: The instructor may download any source upload. Students may download class sources or groups sources when they belong to at least one assigned group; private sources are instructor-only. The response is private and not cacheable.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: sourceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Source file attachment; Content-Type is the stored MIME type, Content-Disposition is attachment, and Cache-Control is private, no-store
          headers:
            Content-Type: { schema: { type: string } }
            Content-Disposition: { schema: { type: string } }
            Cache-Control: { schema: { type: string, const: "private, no-store" } }
          content:
            application/pdf:
              schema: { type: string, format: binary }
            text/plain:
              schema: { type: string, format: binary }
            application/octet-stream:
              schema: { type: string, format: binary }
        "403": { description: Course instructor's EDU license is not active }
        "404": { description: "EDU course, source upload, or authorized download is unavailable" }
        "503": { description: Private source file is temporarily unavailable }
  /edu/courses:
    get:

openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: courses
    description: Student courses and lecture organization
  - name: lectures
    description: Lecture capture, transcripts, and study materials
  - name: collaboration
    description: Course discussion and sharing
  - name: openai
    description: OpenAI-backed transcription and lecture analysis
  - name: notes
    description: Private notes synchronized across devices
  - name: study-plans
    description: Personal study tasks
  - name: student-grades
    description: Paid sync-code student grade estimates
  - name: edu-inquiries
    description: School and university inquiries about ClassScribe EDU
paths:
  /syllabus/confirm:
    post:
      operationId: confirmLibrarySyllabus
      summary: Atomically confirm selected syllabus dates in the current sync-code library
      parameters:
        - in: header
          name: X-CS-User
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LibrarySyllabusInput" }
      responses:
        "200":
          description: Committed course and imported assignments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibrarySyllabusResult" }
        "400": { description: Invalid dates or selection }
        "403": { description: Invalid or revoked library capability }
        "409": { description: Course missing or confirmation conflict }
        "402": { description: Course plan limit reached }
  /privacy/ai-consent:
    get:
      operationId: getAiSharingPermission
      summary: Read the current AI-sharing notice and library permission
      responses:
        "200":
          description: Current notice and server-held permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiSharingPermission"
    post:
      operationId: saveAiSharingPermission
      summary: Explicitly grant or withdraw permission for the current notice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiSharingDecision"
      responses:
        "200":
          description: Permission saved for this library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiSharingPermission"
  /edu-inquiries:
    post:
      operationId: requestEduAccess
      security: []
      tags: [edu-inquiries]
      summary: Send a school inquiry to the ClassScribe EDU team
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EduInquiryInput" }
      responses:
        "200":
          description: The request was accepted by the ClassScribe support mail provider
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EduInquiryAccepted" }
        "400": { description: Invalid or oversized inquiry }
        "429": { description: Too many inquiries in a short period }
        "503": { description: Inquiry delivery or request limits are unavailable }
  /library-link:
    get:
      operationId: getLibraryLink
      security: [{ ClerkSessionBearer: [] }]
      tags: [notes]
      summary: Get the authenticated account's linked legacy library
      responses:
        "200":
          description: Linked library status; response is not cacheable
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [linked]
                    properties:
                      linked: { type: boolean, const: false }
                  - type: object
                    required: [linked, code]
                    properties:
                      linked: { type: boolean, const: true }
                      code: { $ref: "#/components/schemas/LegacySyncCode" }
        "401": { description: Authentication required }
        "503": { description: Mapping storage or encryption unavailable }
    post:
      operationId: linkLegacyLibrary
      security: [{ ClerkSessionBearer: [] }]
      tags: [notes]
      summary: Link a proven legacy library to the authenticated account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              additionalProperties: false
              properties:
                code: { $ref: "#/components/schemas/LegacySyncCode" }
      responses:
        "200":
          description: Library linked (or already linked to this account)
          content:
            application/json:
              schema:
                type: object
                required: [linked]
                properties:
                  linked: { type: boolean, const: true }
        "400": { description: "Invalid, revoked, or unproven library code" }
        "401": { description: Authentication required }
        "409": { description: "Account or library is already linked elsewhere" }
        "503": { description: Mapping storage or encryption unavailable }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /health:
    get:
      operationId: legacyClassscribeHealth
      tags: [health]
      summary: Legacy ClassScribe service health
      responses:
        "200":
          description: Provider status compatible with the native ClassScribe app
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegacyClassscribeHealth" }
  /db/get:
    post:
      operationId: legacyClassscribeDbGet
      security: [{ ClassscribeSyncCode: [] }]
      tags: [notes]
      summary: Read an owned or capability-scoped ClassScribe document
      description: Shared posts/lectures require groupCode matching the stored document. Reading another member profile requires groupCode and a membership activity in that group.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LegacyDbInput" }
      responses:
        "200":
          description: Document value, or null when absent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegacyDbGetOutput" }
        "403": { description: Invalid sync code or unauthorized path }
  /db/set:
    post:
      operationId: legacyClassscribeDbSet
      security: [{ ClassscribeSyncCode: [] }]
      tags: [notes]
      summary: Replace an owned or group-scoped ClassScribe document
      description: posts/shared writes require a valid group capability in data.code and the author sync code in data.by. notebooks documents use the group capability as their path id and must keep it in data.code.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LegacyDbInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegacyDbWriteOutput" }
  /db/update:
    post:
      operationId: legacyClassscribeDbUpdate
      security: [{ ClassscribeSyncCode: [] }]
      tags: [notes]
      summary: Merge into an owned or group-scoped ClassScribe document
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LegacyDbInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegacyDbWriteOutput" }
  /db/delete:
    post:
      operationId: legacyClassscribeDbDelete
      security: [{ ClassscribeSyncCode: [] }]
      tags: [notes]
      summary: Delete an owned or group-scoped ClassScribe document
      description: Deleting posts/shared requires groupCode matching the stored document. Notebook documents are addressed by their group capability path.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LegacyDbInput" }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegacyDbWriteOutput" }
  /db/list:
    post:
      operationId: legacyClassscribeDbList
      security: [{ ClassscribeSyncCode: [] }]
      tags: [notes]
      summary: List direct children of an owned collection or one authorized class group
      description: posts and shared require exactly one where clause of [code, ==, groupCode]. The server filters by the capability before returning documents.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LegacyDbInput" }
      responses:
        "200":
          description: Matching documents
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegacyDbListOutput" }
  /ai:
    post:
      operationId: legacyClassscribeAi
      security: [{ ClassscribeSyncCode: [] }]
      tags: [openai]
      summary: ClassScribe sync-code authenticated AI chat compatibility endpoint
      description: Accepts a bounded Anthropic Messages-shaped conversation; tool calls are returned for the client to execute.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LegacyAiInput" }
      responses:
        "200":
          description: Compatible text and tool-use blocks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegacyAiOutput" }
        "429": { description: Rate or concurrency limit reached }
        "503": { description: AI provider unavailable }
  /transcribe:
    post:
      operationId: legacyClassscribeTranscribe
      security: [{ ClassscribeSyncCode: [] }]
      tags: [openai]
      summary: Transcribe base64 audio for the ClassScribe native app
      description: Lecture requests can set timed to true to use ElevenLabs Scribe when connected; segment starts come from its timed words. Otherwise the managed OpenAI integration returns text with null timestamps; a direct Whisper key can return timed segments. Audio is forwarded to the transcription provider but is not stored by this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LegacyTranscriptionInput" }
      responses:
        "200":
          description: Provider-timed transcript phrases, or explicitly untimed text when timing is unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegacyTranscriptionOutput" }
        "413": { description: Recording exceeds the 25 MB decoded audio limit }
        "429": { description: Rate or concurrency limit reached }
        "503": { description: Transcription provider unavailable }
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [courses]
      summary: Get course and study overview
      responses:
        "200":
          description: Dashboard overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /dashboard/glance:
    get:
      operationId: getDashboardGlance
      tags: [courses]
      summary: Get due dates, recent practice sets, and bookmarks
      responses:
        "200":
          description: Home at-a-glance data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardGlance"
  /ai/evidence:
    post:
      operationId: searchPrivateEvidence
      tags: [classscribe]
      summary: Search fresh private sync-library passages by meaning or keywords
      parameters:
        - in: header
          name: X-CS-User
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrivateEvidenceInput" }
      responses:
        "200":
          description: Permission-checked passages and explicit search coverage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateEvidenceResult" }
        "400": { description: Invalid search }
        "403": { description: Library access or AI permission required }
        "429": { description: Search rate limit reached }
        "503": { description: Search unavailable }
  /classscribe/ask:
    post:
      operationId: askClassscribe
      security: [{ ClerkSessionBearer: [] }]
      tags: [openai]
      summary: Answer a question grounded in the student's scoped course material
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskClassscribeInput"
      responses:
        "200":
          description: Grounded answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskAnswerResult"
        "401":
          description: Sign in required
        "404":
          description: Course or term is unavailable to this student
  /classscribe/ask/source/{kind}/{id}:
    get:
      operationId: getClassscribeAskSource
      security: [{ ClerkSessionBearer: [] }]
      tags: [openai]
      summary: Retrieve an owned source cited by ClassScribe Ask
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string, enum: [note, assignment, syllabus] }
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Persisted source content, bounded to 24,000 characters
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AskSourceResult" }
        "401": { description: Sign in required }
        "404": { description: "Source kind, source ID, or ownership is unavailable" }
  /courses:
    get:
      operationId: listCourses
      tags: [courses]
      summary: List courses available to the signed-in student
      responses:
        "200":
          description: Courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"
    post:
      operationId: createCourse
      tags: [courses]
      summary: Create a course
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseInput"
      responses:
        "201":
          description: Course created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
  /schedule/import-preview:
    post:
      operationId: previewScheduleImport
      tags: [courses, openai]
      summary: Extract proposed courses and recurring meetings from schedule text or a file
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleImportInput" }
      responses:
        "200":
          description: Validated proposals for student review; nothing is saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduleImportPreview" }
        "413": { description: Schedule file exceeds the 8 MB limit }
        "422": { description: No valid courses or meetings could be extracted }
  /schedule/import-confirm:
    post:
      operationId: confirmScheduleImport
      tags: [courses]
      summary: Apply explicitly reviewed schedule proposals
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleImportConfirmInput" }
      responses:
        "200":
          description: Courses whose meetings were applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduleImportConfirmResult" }
        "403": { description: Only a course owner may change its shared schedule }
        "409": { description: Existing meetings require explicit replacement confirmation }
  /courses/{id}:
    patch:
      operationId: updateCourse
      tags: [courses]
      summary: Update a course
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseUpdate"
      responses:
        "200":
          description: Updated course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "404":
          description: Course not found
  /courses/{id}/study-guide:
    get:
      operationId: getStudyGuide
      tags: [courses]
      summary: Get the signed-in student's saved course study guide
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Current guide, or null when none has been generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyGuideResult"
    post:
      operationId: generateStudyGuide
      tags: [courses]
      summary: Generate and save a study guide from course material
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Saved study guide
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyGuide"
        "422":
          description: No course material available
  /courses/{id}/grades:
    get:
      operationId: getCourseGrades
      tags: [courses]
      summary: Get a private course gradebook with syllabus assignments
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Course gradebook
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseGradebook" }
    put:
      operationId: updateCourseGrades
      tags: [courses]
      summary: Save private grading weights, scores, and credit hours
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GradebookUpdate" }
      responses:
        "200":
          description: Saved gradebook
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseGradebook" }
  /courses/{id}/grades/need:
    post:
      operationId: calculateNeededGrade
      tags: [courses]
      summary: Calculate a conditional score needed on one ungraded item
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NeededGradeInput" }
      responses:
        "200":
          description: Needed score and assumptions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NeededGradeResult" }
  /grades/overview:
    get:
      operationId: getGradesOverview
      tags: [courses]
      summary: Get private course gradebooks for term GPA projections
      responses:
        "200":
          description: Gradebooks and scale
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GradesOverview" }
  /student/grades/list:
    post:
      operationId: listStudentGrades
      security: [{ ClassscribeSyncCode: [] }]
      tags: [student-grades]
      summary: List gradebooks for courses in the paid sync-code library
      description: Every result is an estimate from student-entered scores; it is not an official course grade.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudentGradeListInput" }
      responses:
        "200":
          description: Grade estimates and estimated GPA
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentGradeListResponse" }
        "403": { description: "Invalid sync code, replaced library, or active paid plan required" }
        "503": { description: "Paid entitlement could not be verified" }
  /student/grades/save:
    post:
      operationId: saveStudentGradebook
      security: [{ ClassscribeSyncCode: [] }]
      tags: [student-grades]
      summary: Save a gradebook for a course in the paid sync-code library
      description: Supply the currently stored version (0 for a new gradebook). Successful saves increment it. All resulting grades remain estimates, never official grades.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudentGradeSaveInput" }
      responses:
        "200":
          description: Saved gradebooks, analyses, and estimated GPA
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentGradeListResponse" }
        "400": { description: "Invalid gradebook data" }
        "403": { description: "Invalid sync code, replaced library, or active paid plan required" }
        "404": { description: "Course does not belong to this sync-code library" }
        "409": { description: "Gradebook version conflict" }
        "503": { description: "Paid entitlement could not be verified" }
  /grades/scale:
    get:
      operationId: getGradeScale
      tags: [courses]
      summary: Get the student's editable school grading scale
      responses:
        "200":
          description: School grading scale
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GradeScale" }
    put:
      operationId: updateGradeScale
      tags: [courses]
      summary: Save the student's school grading scale
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GradeScaleUpdate" }
      responses:
        "200":
          description: School grading scale
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GradeScale" }
  /courses/{id}/lectures:
    get:
      operationId: listCourseLectures
      tags: [lectures]
      summary: List lectures in a course
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lectures
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lecture"
  /courses/{id}/dates:
    get:
      operationId: listCourseDates
      tags: [courses]
      summary: List extracted assignment and exam dates for a course
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Course dates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AcademicDate"
  /lectures:
    post:
      operationId: createLecture
      tags: [lectures]
      summary: Add a lecture to a course
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LectureInput"
      responses:
        "201":
          description: Lecture created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lecture"
  /lectures/{id}:
    get:
      operationId: getLecture
      tags: [lectures]
      summary: Get lecture details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lecture
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lecture"
        "404":
          description: Lecture not found
    patch:
      operationId: updateLecture
      tags: [lectures]
      summary: Update lecture notes and transcript
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LectureUpdate"
      responses:
        "200":
          description: Updated lecture
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lecture"
        "404":
          description: Lecture not found
    delete:
      operationId: deleteLecture
      tags: [lectures]
      summary: Delete a lecture
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Lecture deleted
        "404":
          description: Lecture not found
  /lectures/{id}/transcribe:
    post:
      operationId: transcribeLecture
      tags: [openai]
      summary: Transcribe recorded lecture audio
      description: Accepts a temporary base64-encoded audio recording. The audio is not stored.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranscriptionInput"
      responses:
        "200":
          description: Transcript
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptionOutput"
  /materials/extract:
    post:
      operationId: extractMaterialText
      security: [{ ClassscribeSyncCode: [] }]
      tags: [notes]
      summary: Extract text from a private source file for library import
      description: >
        Accepts PDF or strict UTF-8 plain text up to 8 MiB. Markdown is uploaded
        as text/plain. Only extracted text is returned; raw file bytes are never
        stored. Free libraries may import the result as a private existing
        legacy note with id, courseId, lectureId:"", title, body,
        sourceType (syllabus, reading, or study-guide), optional sourceName,
        created, updated, and pinned:false. The note body is sent to AI only
        when the user explicitly generates study materials; existing Student
        and Pro AI gates still apply.
      requestBody:
        required: true
        content:
          application/pdf:
            schema: { $ref: "#/components/schemas/MaterialFileUpload" }
          text/plain:
            schema: { $ref: "#/components/schemas/MaterialFileUpload" }
      responses:
        "200":
          description: Extracted text, truncated to at most 30,000 characters
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaterialTextExtractionResult" }
        "400": { description: "Empty, malformed, or invalid UTF-8 file" }
        "403": { description: Invalid or revoked library code }
        "413": { description: File exceeds 8 MiB }
        "415": { description: Unsupported media type or content does not match its declared type }
        "422": { description: "PDF contains no extractable text, such as a scanned PDF" }
  /lectures/{id}/analyze:
    post:
      operationId: analyzeLecture
      tags: [openai]
      summary: Create study materials from a lecture transcript
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisInput"
      responses:
        "200":
          description: Lecture analysis
          content:
            application/json:
              schema:

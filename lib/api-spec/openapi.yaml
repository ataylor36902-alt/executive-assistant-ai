        "204": { description: Attachment removed }
        "404": { description: Attachment unavailable }
  /edu/courses/{id}/assignments/{itemId}/file:
    get:
      operationId: downloadEduAssignmentFile
      tags: [courses]
      summary: Download an assignment attachment after verifying enrollment
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Private file stream
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { description: Assignment unavailable }
  /edu/courses/{id}/assignments/{itemId}/submission:
    delete:
      operationId: deleteEduSubmission
      tags: [courses]
      summary: Delete your own ungraded submission and its private attachment
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Submission deleted; storage cleanup may be retried
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EduFileCleanupResult" }
        "404": { description: Submission unavailable }
        "409": { description: Submission is already graded }
    post:
      operationId: submitEduAssignment
      tags: [courses]
      summary: Create or update the signed-in student's own ungraded submission
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EduSubmissionInput" }
      responses:
        "200":
          description: Submission saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EduSubmissionResult" }
        "404": { description: Assignment unavailable to the student }
        "409": { description: Submission is already graded }
  /edu/courses/{id}/assignments/{itemId}/submissions/{submissionId}/file:
    get:
      operationId: downloadEduSubmissionFile
      tags: [courses]
      summary: Download a private submission file as its student or course instructor
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: submissionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Private file, never publicly cached
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { description: File unavailable to this account }
  /edu/courses/{id}/assignments/{itemId}/submissions:
    get:
      operationId: listEduSubmissions
      tags: [courses]
      summary: Instructor-only assignment submissions and grades
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Submissions visible only to this course instructor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EduSubmissionList" }
        "404": { description: Assignment unavailable to the instructor }
  /edu/courses/{id}/assignments/{itemId}/submissions/{submissionId}:
    patch:
      operationId: gradeEduSubmission
      tags: [courses]
      summary: Grade a submission owned by an EDU course student
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: submissionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EduGradeInput" }
      responses:
        "200":
          description: Grade saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EduSubmissionResult" }
        "404": { description: Submission unavailable to the instructor }
  /study-plans/import:
    post:
      operationId: importStudyPlans
      tags: [study-plans]
      summary: Import local tasks once, safely on retry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudyPlanImport" }
      responses:
        "200":
          description: Imported tasks
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StudyPlan" }
  /study-plans/{id}:
    patch:
      operationId: updateStudyPlan
      tags: [study-plans]
      summary: Check or uncheck a study task
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudyPlanUpdate" }
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudyPlan" }
        "404": { description: Task not found }
    delete:
      operationId: deleteStudyPlan
      tags: [study-plans]
      summary: Delete a study task
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Task deleted }
        "404": { description: Task not found }
  /ai/study/source-summary:
    post:
      operationId: analyzeCourseSource
      summary: Summarize an uploaded course document and extract key points on any plan
      security:
        - ClassscribeSyncCode: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseSourceInput"
      responses:
        "200":
          description: Private source analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseSourceAnalysis"
        "400":
          description: Invalid material
        "403":
          description: AI-sharing permission is required
        "503":
          description: Analysis is temporarily unavailable
components:
  securitySchemes:
    ClassscribeSyncCode:
      type: apiKey
      in: header
      name: X-CS-User
      description: High-entropy ClassScribe bearer sync code (u_ plus 16–40 alphanumeric characters). This is separate from a class group capability (g_ plus 32 lowercase hexadecimal characters).
    ClerkSessionBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Clerk-authenticated account session token.
  schemas:
    LibrarySyllabusInput:
      type: object
      additionalProperties: false
      required: [importId, courseId, existing, course, modules, assignments, selectedDates]
      properties:
        importId: { type: string, minLength: 1, maxLength: 64, pattern: "^[A-Za-z0-9_-]+$" }
        courseId: { type: string, minLength: 1, maxLength: 64, pattern: "^[A-Za-z0-9_-]+$" }
        existing: { type: boolean }
        course:
          type: object
          additionalProperties: false
          required: [code, name, professor, semester]
          properties:
            code: { type: string, maxLength: 100 }
            name: { type: string, maxLength: 300 }
            professor: { type: string, maxLength: 300 }
            semester: { type: string, maxLength: 100 }
        modules:
          type: array
          maxItems: 200
          items: { type: string, minLength: 1, maxLength: 500 }
        assignments:
          type: array
          maxItems: 300
          items: { $ref: "#/components/schemas/LibrarySyllabusItem" }
        selectedDates:
          type: array
          maxItems: 300
          items: { type: integer, minimum: 0, maximum: 299 }
    LibrarySyllabusItem:
      type: object
      additionalProperties: false
      required: [title, type, due]
      properties:
        title: { type: string, minLength: 1, maxLength: 500 }
        type: { type: string, enum: [homework, reading, quiz, exam, project] }
        due: { type: string, maxLength: 10 }
    LibrarySyllabusResult:
      type: object
      required: [course, assignments]
      properties:
        course:
          type: object
          additionalProperties: true
        assignments:
          type: array
          items:
            type: object
            additionalProperties: true
    CourseSourceInput:
      type: object
      additionalProperties: false
      required: [material]
      properties:
        material:
          type: string
          minLength: 1
          maxLength: 60000
    CourseSourceAnalysis:
      type: object
      required: [summary, keyPoints]
      properties:
        summary:
          type: string
          minLength: 1
          maxLength: 3000
        keyPoints:
          type: array
          maxItems: 12
          items:
            type: string
            minLength: 1
            maxLength: 1500
    AiSharingDecision:
      type: object
      additionalProperties: false
      required: [version, accepted]
      properties:
        version: { type: string }
        accepted: { type: boolean }
    AiSharingPermission:
      type: object
      required: [version, title, notice, accepted]
      properties:
        version: { type: string }
        title: { type: string }
        notice: { type: string }
        accepted: { type: boolean }
    MaterialFileUpload:
      type: string
      description: Raw PDF or UTF-8 plain-text bytes, at most 8 MiB; transported as the request body.
    MaterialTextExtractionResult:
      type: object
      additionalProperties: false
      required: [text, truncated, originalLength]
      properties:
        text: { type: string, maxLength: 30000 }
        truncated: { type: boolean }
        originalLength: { type: integer, minimum: 0 }
    EduInquiryInput:
      type: object
      additionalProperties: false
      required: [name, email, school, role]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        email:
          type: string
          format: email
          maxLength: 254
        school: { type: string, minLength: 1, maxLength: 160 }
        role: { type: string, minLength: 1, maxLength: 120 }
        message: { type: string, maxLength: 1200 }
    EduInquiryAccepted:
      type: object
      required: [accepted]
      properties:
        accepted: { type: boolean, const: true }
    LegacyClassscribeHealth:
      type: object
      required: [ok, ai, transcribe, model]
      properties:
        ok: { type: boolean }
        ai: { type: boolean }
        transcribe: { type: boolean }
        model: { type: string }
    LegacyDocumentData:
      type: object
      additionalProperties: true
    LegacyDbInput:
      type: object
      required: [path]
      properties:
        path: { type: string, minLength: 1, maxLength: 512 }
        data: { $ref: "#/components/schemas/LegacyDocumentData" }
        groupCode:
          $ref: "#/components/schemas/LegacyGroupCode"
          description: Required for direct reads/deletes of posts/shared documents and for looking up another member profile.
        where:
          type: array
          maxItems: 10
          items:
            type: array
            minItems: 3
            maxItems: 3
            items: {}
    LegacyGroupCode:
      type: string
      pattern: "^g_[a-f0-9]{32}$"
      description: Independent, high-entropy per-class invite capability. Not the human-readable course code or X-CS-User sync code.
    LegacySyncCode:
      type: string
      pattern: "^u_[A-Za-z0-9]{16,40}$"
      description: Private library bearer code; an authenticated linked account may recover it.
    LegacyDbGetOutput:
      type: object
      required: [data]
      properties:
        data:
          oneOf:
            - $ref: "#/components/schemas/LegacyDocumentData"
            - type: "null"
    LegacyDbWriteOutput:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
    LegacyDbDocument:
      type: object
      required: [id, data]
      properties:
        id: { type: string }
        data: { $ref: "#/components/schemas/LegacyDocumentData" }
    LegacyDbListOutput:
      type: object
      required: [docs]
      properties:
        docs:
          type: array
          items: { $ref: "#/components/schemas/LegacyDbDocument" }
    StudentGradeListInput:
      type: object
      additionalProperties: false
    StudentGradeWeights:
      type: object
      required: [assignment, project, quiz, test]
      additionalProperties: false
      properties:
        assignment: { type: number, minimum: 0, maximum: 100 }
        project: { type: number, minimum: 0, maximum: 100 }
        quiz: { type: number, minimum: 0, maximum: 100 }
        test: { type: number, minimum: 0, maximum: 100 }
    StudentGradeItem:
      type: object
      required: [id, title, type, earned, possible, date]
      additionalProperties: false
      properties:
        id: { type: string, minLength: 1, maxLength: 160 }
        assignmentId: { type: string, minLength: 1, maxLength: 160, description: "Optional private course assignment linked to this score. The score snapshot remains if the assignment is removed." }
        title: { type: string, minLength: 1, maxLength: 160 }
        type: { type: string, enum: [assignment, project, quiz, test] }
        earned: { type: ["number", "null"], minimum: 0 }
        possible: { type: number, exclusiveMinimum: 0 }
        date: { type: ["string", "null"], pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
    StudentGradeItemInput:
      type: object
      required: [id, title, type, earned, possible]
      additionalProperties: false
      properties:
        id: { type: string, minLength: 1, maxLength: 160 }
        assignmentId: { type: string, minLength: 1, maxLength: 160 }
        title: { type: string, minLength: 1, maxLength: 160 }
        type: { type: string, enum: [assignment, project, quiz, test] }
        earned: { type: ["number", "null"], minimum: 0 }
        possible: { type: number, exclusiveMinimum: 0 }
        date: { type: ["string", "null"], pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
    StudentGradebook:
      type: object
      required: [courseId, credits, weights, items, finalPercent, version]
      additionalProperties: false
      properties:
        courseId: { type: string, minLength: 1, maxLength: 160 }
        credits: { type: number, minimum: 0, maximum: 12 }
        weights:
          oneOf:
            - $ref: "#/components/schemas/StudentGradeWeights"
            - type: "null"
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/StudentGradeItem" }
        finalPercent:
          type: ["number", "null"]
          minimum: 0
          maximum: 100
          description: Optional student-entered overall estimate, not an official grade.
        version:
          type: integer
          minimum: 0
          description: Stored version used for optimistic concurrency; start at 0 for a new gradebook.
    StudentGradebookInput:
      type: object
      required: [courseId, credits, weights, items, finalPercent, version]
      additionalProperties: false
      properties:
        courseId: { type: string, minLength: 1, maxLength: 160 }
        credits: { type: number, minimum: 0, maximum: 12 }
        weights:
          oneOf:
            - $ref: "#/components/schemas/StudentGradeWeights"
            - type: "null"
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/StudentGradeItemInput" }
        finalPercent:
          type: ["number", "null"]
          minimum: 0
          maximum: 100
          description: Optional student-entered overall estimate, not an official grade.
        version:
          type: integer
          minimum: 0
          description: Current version. Saves increment this after a successful write.
    StudentGradeAnalysisType:
      type: object
      required: [type, averagePercent]
      properties:
        type: { type: string, enum: [assignment, project, quiz, test] }
        averagePercent: { type: ["number", "null"], minimum: 0, maximum: 100 }
    StudentGradeAnalysis:
      type: object
      required: [averagePercent, letter, gradePoints, byType, isEstimate]
      properties:
        averagePercent: { type: ["number", "null"], minimum: 0, maximum: 100 }
        letter: { type: ["string", "null"] }
        gradePoints: { type: ["number", "null"], minimum: 0, maximum: 4 }
        byType:
          type: array
          items: { $ref: "#/components/schemas/StudentGradeAnalysisType" }
        isEstimate: { type: boolean }
    StudentGradeCourse:
      type: object
      required: [gradebook, analysis]
      properties:
        gradebook: { $ref: "#/components/schemas/StudentGradebook" }
        analysis: { $ref: "#/components/schemas/StudentGradeAnalysis" }
    StudentGradeListResponse:
      type: object
      required: [courses, summary]
      properties:
        courses:
          type: array
          items: { $ref: "#/components/schemas/StudentGradeCourse" }
        summary:
          type: object
          required: [estimatedGpa, countedCredits]
          properties:
            estimatedGpa: { type: ["number", "null"], minimum: 0, maximum: 4 }
            countedCredits: { type: number, minimum: 0 }
    StudentGradeSaveInput:
      type: object
      required: [gradebook]
      additionalProperties: false
      properties:
        gradebook: { $ref: "#/components/schemas/StudentGradebookInput" }
    LegacyAiMessage:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [user, assistant, system] }
        content:
          oneOf:
            - type: string
            - type: array
              items: { type: object, additionalProperties: true }
    LegacyAiTool:
      type: object
      required: [name, description, input_schema]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        description: { type: string, maxLength: 2000 }
        input_schema: { type: object, additionalProperties: true }
    LegacyAiInput:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 80
          items: { $ref: "#/components/schemas/LegacyAiMessage" }
        tools:
          type: array
          maxItems: 16
          items: { $ref: "#/components/schemas/LegacyAiTool" }
        tier: { type: string, enum: [quick, standard] }
    LegacyAiContentBlock:
      type: object
      properties:
        type: { type: string, enum: [text, tool_use] }
        text: { type: string }
        id: { type: string }
        name: { type: string }
        input: { type: object, additionalProperties: true }
    LegacyAiOutput:
      type: object
      required: [content, stop_reason]
      properties:
        content:
          type: array
          items: { $ref: "#/components/schemas/LegacyAiContentBlock" }
        stop_reason: { type: string, enum: [end_turn, tool_use, max_tokens] }
    LegacyTranscriptionInput:
      type: object
      required: [audio]
      properties:
        audio: { type: string, contentEncoding: base64, maxLength: 34952536 }
        filename: { type: string, maxLength: 120 }
        mime: { type: string, maxLength: 80 }
        timed: { type: boolean, description: "Request provider-timed transcript phrases when a timestamp-capable provider is connected." }
    LegacyTranscriptSegment:
      type: object
      required: [t, x]
      properties:
        t: { type: ["number", "null"], minimum: 0, description: "Seconds from the start of the audio, or null if the provider returned only text." }
        x: { type: string }
    LegacyTranscriptionOutput:
      type: object
      required: [segments]
      properties:
        segments:
          type: array
          items: { $ref: "#/components/schemas/LegacyTranscriptSegment" }
    GradeWeight:
      type: object
      required: [category, weight]
      properties:
        category: { type: string, minLength: 1, maxLength: 80 }
        weight: { type: number, minimum: 0, maximum: 100 }
    GradeItem:
      type: object
      required: [id, title, category, type, source, scorePercent]
      properties:
        id: { type: string, minLength: 1, maxLength: 200 }
        title: { type: string, minLength: 1, maxLength: 200 }
        category: { type: string, minLength: 1, maxLength: 80 }
        type: { type: string }
        source: { type: string, enum: [syllabus, manual] }
        scorePercent: { type: ["number", "null"], minimum: 0, maximum: 100 }
        archived: { type: boolean }
    GradebookUpdate:
      type: object
      required: [creditHours, finalLetter, weights, items]
      properties:
        creditHours: { type: ["number", "null"], minimum: 0, maximum: 30 }
        finalLetter: { type: ["string", "null"] }
        weights:
          type: array
          maxItems: 30
          items: { $ref: "#/components/schemas/GradeWeight" }
        items:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/GradeItem" }
    CourseGradebook:
      type: object
      required: [courseId, courseName, term, creditHours, finalLetter, weights, items, weightsTotal, currentPercent, currentLetter, needsWeightReview]
      properties:
        courseId: { type: string, format: uuid }
        courseName: { type: string }
        term: { type: string }
        creditHours: { type: ["number", "null"] }
        finalLetter: { type: ["string", "null"] }
        weights:
          type: array
          items: { $ref: "#/components/schemas/GradeWeight" }
        items:
          type: array
          items: { $ref: "#/components/schemas/GradeItem" }
        weightsTotal: { type: number }
        currentPercent: { type: ["number", "null"] }
        currentLetter: { type: ["string", "null"] }
        needsWeightReview: { type: boolean }
    GradeScaleEntry:
      type: object
      required: [letter, minPercent, points]
      properties:
        letter: { type: string, minLength: 1, maxLength: 12 }
        minPercent: { type: number, minimum: 0, maximum: 100 }
        points: { type: number, minimum: 0, maximum: 5 }
    GradeScale:
      type: object
      required: [entries, customized]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/GradeScaleEntry" }
        customized: { type: boolean }
    GradeScaleUpdate:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          minItems: 2
          maxItems: 20
          items: { $ref: "#/components/schemas/GradeScaleEntry" }
    GradesOverview:
      type: object
      required: [scale, courses]
      properties:
        scale: { $ref: "#/components/schemas/GradeScale" }
        courses:
          type: array
          items: { $ref: "#/components/schemas/CourseGradebook" }
    NeededGradeInput:
      type: object
      required: [itemId, targetLetter]
      properties:
        itemId: { type: string, minLength: 1 }
        targetLetter: { type: string, minLength: 1 }
    NeededGradeResult:
      type: object
      required: [requiredPercent, message, assumption]
      properties:
        requiredPercent: { type: ["number", "null"] }
        message: { type: string }
        assumption: { type: string }
    StudyGuideSource:
      type: object
      required: [id, title]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
    StudyGuide:
      type: object
      required: [id, courseId, content, sources, updatedAt]
      properties:
        id: { type: string, format: uuid }
        courseId: { type: string, format: uuid }
        content: { type: string }
        sources:
          type: array
          items: { $ref: "#/components/schemas/StudyGuideSource" }
        updatedAt: { type: string, format: date-time }
    StudyGuideResult:
      type: object
      required: [guide]
      properties:
        guide:
          oneOf:
            - $ref: "#/components/schemas/StudyGuide"
            - type: "null"
    StudyPlan:
      type: object
      required: [id, text, completed, createdAt]
      properties:
        id: { type: string }
        text: { type: string }
        completed: { type: boolean }
        createdAt: { type: string, format: date-time }
    StudyPlanInput:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 500 }
    StudyPlanUpdate:
      type: object
      required: [completed]
      properties:
        completed: { type: boolean }
    LegacyStudyPlan:
      type: object
      required: [id, text, completed]
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        text: { type: string, minLength: 1, maxLength: 500 }
        completed: { type: boolean }
    StudyPlanImport:
      type: object
      required: [source, tasks]
      properties:
        source: { type: string, enum: [web, mobile] }
        tasks:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/LegacyStudyPlan" }
    PrivateEvidenceInput:
      type: object
      additionalProperties: false
      required: [query, courseIds, mode]
      properties:
        query: { type: string, minLength: 1, maxLength: 2000 }
        mode: { type: string, enum: [semantic, keyword] }
        courseIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: string, pattern: "^[A-Za-z0-9_-]{1,128}$" }
    PrivateEvidencePassage:
      type: object
      required: [kind, id, courseId, title, text]
      properties:
        kind: { type: string }
        id: { type: string }
        courseId: { type: string }
        title: { type: string }
        text: { type: string }
        seconds: { type: number, minimum: 0 }
    PrivateEvidenceCoverage:
      type: object
      required: [searchedPassages, availablePassages, truncatedSources, partial, sourceLimitReached]
      properties:

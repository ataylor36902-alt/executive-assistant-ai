kind = "mobile"
previewPath = "/"
title = "ClassScribe Mobile"
description = "Native companion for consent-first lecture recording, transcript review, and study notes connected to ClassScribe courses."
version = "1.0.0"
id = "artifacts/classscribe-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 18979

[services.development]
run = "pnpm --filter @workspace/classscribe-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/classscribe-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/classscribe-mobile", "run", "serve" ]

[services.env]
PORT = "18979"
BASE_PATH = "/"

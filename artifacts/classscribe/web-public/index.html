<style>
:root{
  color-scheme:light;--phone-bg:#F2F4F3;--bg:#F2F4F3;--surface:#FFFFFF;--surface-2:#F5F8F6;--ink:#13201B;--muted:#5A6A63;--faint:#737E78;--line:#D6DFDA;--accent:#1B6A55;--accent-ink:#FFFFFF;--accent-soft:#DBEEE6;--rec-ink:#FFFFFF;--hero:#1B6A55;--hero-ink:#FFFFFF;--logo:#1B6A55;--hi:#F2CF4F;--hi-soft:#FBF0C2;--hi-ink:#5B4600;--rec:#D13C33;--rec-soft:#FBE2DF;--good:#1F7A4A;--warn:#A86400;--warn-soft:#FBEBD2;--c1:#1B6A55;--c2:#3B5BA9;--c3:#A2542A;--c4:#7A4B9A;--c5:#2E7D8C;--c6:#8A6D12
  --shadow:0 1px 2px rgba(19,32,27,.06),0 6px 20px rgba(19,32,27,.06);
  --radius:12px;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --phone-bg:#000000;--bg:#0C1311;--surface:#1C1C1E;--surface-2:#2C2C2E;--ink:#E3ECE7;--muted:#93A49C;--faint:#93A49C;--line:#38383A;--accent:#5CC3A3;--accent-ink:#052219;--accent-soft:#17382F;--rec-ink:#052219;--hero:#17382F;--hero-ink:#FFFFFF;--logo:#1B6A55;--hi:#E3C047;--hi-soft:#3A3219;--hi-ink:#F4DF92;--rec:#F06A5F;--rec-soft:#3C1D1A;--good:#6BCB94;--warn:#E9A948;--warn-soft:#3A2B14;--c1:#5CC3A3;--c2:#8AA6F0;--c3:#E79A6D;--c4:#C39AE4;--c5:#6CC6D6;--c6:#D9BC5C
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.6rem,3.2vw,2.2rem);font-weight:800}
h2{font-size:1.3rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-size:.82em;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* A brief opening scene shared with the phone app. */
#launch-intro{--launch-size:clamp(42px,calc(22.5vw - 16.65px),72px);--launch-width:clamp(185px,calc(99vw - 73.26px),317px);position:fixed;inset:0;z-index:10000;width:100%;height:100dvh;border:0;border-radius:0;padding:0;background:#1B6A55;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:opacity .26s ease}
#launch-intro.done{opacity:0;pointer-events:none}
.launch-scene{position:relative;width:calc(var(--launch-width) + 50px);height:122px;max-width:calc(100vw - 32px)}
.launch-window{height:122px;width:var(--launch-width);white-space:nowrap;display:flex;align-items:center}
.launch-word{font:600 var(--launch-size)/100px "Dancing Script","Brush Script MT",cursive;white-space:nowrap;padding-left:2px;flex:none}
.launch-pen{position:absolute;top:12px;left:calc(var(--launch-width) - 5px);width:54px;height:72px;transform:translateY(1px)}
.launch-company{margin-top:8px;color:#D9BC5C;font:700 19px/1.3 var(--f-body);letter-spacing:.8px}
.launch-hint{position:absolute;bottom:52px;left:0;right:0;text-align:center;font:400 12px/1.4 var(--f-body);letter-spacing:.4px;opacity:.75}
@media(prefers-reduced-motion:reduce){#launch-intro{transition:none}}

/* shell */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--line);background:var(--surface);padding:18px 14px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--logo);color:#fff;display:grid;place-items:center}
.brand b{font-family:var(--f-display);font-size:1.25rem;font-weight:800;letter-spacing:-.02em}
.brand small{display:block;font-size:.7rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:-2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 10px;border-radius:8px;text-align:left;color:var(--ink);font-weight:700;font-size:.95rem;min-height:44px}
.nav button:hover{background:var(--surface-2)}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
.nav svg{width:18px;height:18px;flex:none}
.tree{display:flex;flex-direction:column;gap:2px}
.tree .sem{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:4px 10px}
.tree button{border:0;background:none;display:flex;gap:9px;align-items:center;padding:7px 10px;border-radius:8px;text-align:left;font-size:.92rem}
.tree button:hover{background:var(--surface-2)}
.tree button[aria-current="true"]{background:var(--surface-2);font-weight:700}
.dot{width:9px;height:9px;border-radius:3px;flex:none;background:var(--cc,var(--accent))}
.side-foot{font-size:.8rem;color:var(--muted);padding:0 8px}
.main{min-width:0;padding-inline:clamp(16px,3.5vw,44px);padding-block:22px 110px}
.topbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:22px}
.topbar .btn.rec{flex:none;min-height:44px;margin-left:auto}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px;max-width:560px}
.search input{border:0;background:none;padding:10px 0;flex:1;min-width:0;outline:none}
.search svg{width:17px;height:17px;color:var(--muted);flex:none}
.tabbar{display:none}
.mobile-contact{display:none}

/* primitives */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:9px;font-weight:700;font-size:.92rem;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.rec{background:var(--rec);border-color:var(--rec);color:var(--rec-ink)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:5px 10px;font-size:.84rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:14px}
.spread{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.code{background:color-mix(in srgb,var(--cc,var(--accent)) 14%,transparent);color:var(--cc,var(--accent));border-color:transparent}
.chip.hi{background:var(--hi-soft);color:var(--hi-ink);border-color:transparent}
.chip.ok{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--ink);border-color:transparent}
.chip.rec{background:var(--rec-soft);color:var(--ink);border-color:transparent}
.chip.ex{border-style:dashed}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.85rem;font-weight:700;color:var(--muted)}
input.in,select.in,textarea.in{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 11px;color:var(--ink);font-weight:400;font-size:.95rem;width:100%}
textarea.in{resize:vertical;min-height:90px;line-height:1.5}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:14px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 12px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius)}
.hr{height:1px;background:var(--line);border:0;margin:6px 0}

/* page header */
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-h .sub{color:var(--muted);margin-top:6px}

/* home */
.remind{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:14px 16px;border-radius:var(--radius);background:var(--hi-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--hi) 45%,transparent)}
.remind .n{font-family:var(--f-display);font-weight:800;font-size:1.6rem;line-height:1;color:var(--hi-ink);min-width:2.4ch;text-align:center}
.remind .n small{display:block;font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;font-family:var(--f-body)}
.course-card{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;border-top:4px solid var(--cc)}
.course-card:hover{box-shadow:var(--shadow)}
.course-card .meta{display:flex;gap:14px;font-size:.84rem;color:var(--muted)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%}
.li:last-child{border-bottom:0}
button.li:hover{background:var(--surface-2)}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:700}
.date-tile{width:46px;flex:none;text-align:center;border-radius:8px;background:var(--surface-2);padding:4px 0;line-height:1.1}
.date-tile b{display:block;font-family:var(--f-display);font-size:1.1rem}
.date-tile span{font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.notes-grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.notes-list{padding:10px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.note-li{border-radius:9px;padding:9px 8px;border-bottom:0}
.note-li[aria-current="true"]{background:var(--accent-soft)}
.note-title{font-family:var(--f-display);font-size:1.6rem;font-weight:800;border:0;background:none;padding:2px 0;width:100%;outline:none;color:var(--ink)}
.note-title::placeholder{color:var(--muted);opacity:.6}
.note-body{min-height:360px;font-size:1rem;line-height:1.65;border-color:transparent;background:var(--surface-2);resize:vertical}
.note-body:focus{border-color:var(--line);background:var(--surface)}
.note-preview{min-height:200px;padding:4px 2px}
.note-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px solid var(--line)}
.seg-toggle{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg-toggle button{border:0;background:var(--surface);padding:5px 12px;font-weight:700;font-size:.84rem;color:var(--muted)}
.seg-toggle button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
.appearance-quick .seg-toggle button[aria-checked="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.appearance-quick{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;border-top:1px solid var(--line);font-size:.9rem;font-weight:700;color:var(--muted)}
.appearance-quick .seg-toggle{flex:none}
.fmt{min-width:34px;justify-content:center}
.only-m{display:none}
.acct{display:flex;gap:10px;align-items:center;border:0;background:none;text-align:left;padding:8px;border-radius:10px;margin-top:auto}
.acct:hover,.acct[aria-current="true"]{background:var(--surface-2)}
.acct b{display:block;font-size:.92rem}.acct small{display:block;font-size:.76rem;color:var(--muted)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;flex:none}
.avatar.has-photo,.profile-photo-preview.has-photo{overflow:hidden}
.avatar img,.profile-photo-preview img{width:100%;height:100%;display:block;object-fit:cover;border-radius:inherit}
.profile-photo-card{display:flex;align-items:center;gap:18px;max-width:640px;margin-bottom:14px}
.profile-photo-preview{width:88px;height:88px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-family:var(--f-display);font-weight:800;font-size:2rem;overflow:hidden}
.profile-photo-content{min-width:0;flex:1;display:grid;gap:10px}
.profile-photo-content h2{font-size:1.05rem;margin:0 0 3px}
.profile-photo-actions{gap:8px}
#profile-photo-status[data-state="error"]{color:var(--danger,var(--warn))}
#profile-photo-status[data-state="success"]{color:var(--accent)}
.profile-photo-local-notice{padding:9px 11px;border-radius:8px;background:var(--warn-soft);color:var(--warn)}
.profile-photo-actions [hidden]{display:none}
#cap-online-details[hidden]{display:none}
@media(max-width:520px){.profile-photo-card{align-items:flex-start;gap:12px;padding:14px}.profile-photo-preview{width:64px;height:64px;font-size:1.6rem}.profile-photo-actions{flex-wrap:wrap}}
.app.onboarding{grid-template-columns:1fr}.app.onboarding .side{display:none}
.welcome{max-width:560px;margin:0 auto;padding-top:6vh}
.md li.todo{list-style:none;margin-left:-1.2em}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;padding:10px 14px;border:1px dashed var(--line);border-radius:var(--radius);font-size:.9rem;color:var(--muted)}

/* capture */
.recbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;box-shadow:var(--shadow)}
.recdot{width:12px;height:12px;border-radius:50%;background:var(--rec);box-shadow:0 0 0 0 var(--rec)}
.recording .recdot{animation:pulse 1.6s infinite}
.paused .recdot{background:var(--muted)}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--rec) 55%,transparent)}70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.recording .recdot{animation:none}}
.timer{font-family:var(--f-mono);font-size:1.5rem;font-weight:500;font-variant-numeric:tabular-nums}
.consent-pill{font-size:.78rem;font-weight:700;color:var(--ink);background:var(--rec-soft);padding:3px 9px;border-radius:999px}
.check{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font-size:.95rem}
.check input{margin-top:4px;width:18px;height:18px;accent-color:var(--accent);flex:none}

/* transcript */
.tx{display:flex;flex-direction:column;gap:2px}
.seg{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:8px;padding:8px 8px;border-radius:9px;align-items:start}
.seg:hover{background:var(--surface-2)}
.seg .ts{display:flex;flex-direction:column;gap:2px;border:0;background:none;padding:2px 0;color:var(--muted);text-align:left}
.seg .ts-day{font-family:var(--f-body);font-size:.68rem;line-height:1.2;white-space:nowrap}
.seg .ts:hover{color:var(--accent)}
.seg .who{font-size:.74rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--sc,var(--muted));display:block}
.seg.flash{background:var(--hi-soft);transition:background 1.2s}
.seg .x{opacity:0;transition:opacity .15s}
.seg:hover .x,.seg:focus-within .x{opacity:1}
@media (hover:none){.seg .x{opacity:1}}
.mark{display:flex;gap:10px;align-items:center;padding:6px 8px;margin-left:96px;border-left:3px solid var(--hi);background:var(--hi-soft);border-radius:0 8px 8px 0;font-size:.86rem;color:var(--hi-ink);font-weight:700}
.slide{display:flex;gap:12px;align-items:flex-start;margin:6px 0 6px 104px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.slide img{width:120px;border-radius:6px;flex:none;border:1px solid var(--line)}
.slide p{font-size:.88rem}

/* lecture */
.lec-h{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.kp{display:flex;flex-direction:column;gap:10px;counter-reset:kp;padding:0;margin:0;list-style:none}
.kp li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.kp li::before{counter-increment:kp;content:counter(kp);font-family:var(--f-display);font-weight:800;color:var(--accent);background:var(--accent-soft);border-radius:7px;text-align:center;line-height:26px;height:26px}
.emph{display:flex;gap:12px;padding:12px;border-radius:10px;background:var(--hi-soft);align-items:flex-start}
.emph b{display:block}
.emph .why{font-size:.88rem;color:var(--muted)}
.term{display:grid;grid-template-columns:minmax(120px,200px) 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.term:last-child{border-bottom:0}
.term b{font-family:var(--f-display)}
@media (max-width:560px){.term{grid-template-columns:1fr;gap:2px}}
.md{max-width:72ch}
.md h1,.md h2,.md h3{margin:1.1em 0 .4em}
.md h1:first-child,.md h2:first-child,.md h3:first-child{margin-top:0}
.md p{margin:.5em 0}
.md ul,.md ol{margin:.4em 0;padding-left:1.3em}
.md li{margin:.2em 0}
.cite{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:0 8px;font-size:.76rem;font-weight:700;color:var(--accent);vertical-align:1px;cursor:pointer;font-family:var(--f-body)}
.cite:hover{border-color:var(--accent)}

/* study */
.fc-wrap{perspective:1200px;max-width:560px;margin-inline:auto;width:100%}
.fc{position:relative;height:250px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer;border:0;background:none;width:100%;padding:0}
.fc.flip{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;box-shadow:var(--shadow);gap:10px}
.fc .back{transform:rotateY(180deg);background:var(--surface-2)}
.fc .face b{font-family:var(--f-display);font-size:1.5rem}
@media (prefers-reduced-motion:reduce){.fc{transition:none}}
.q{padding:16px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);display:flex;flex-direction:column;gap:10px}
.choice{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface-2);padding:9px 12px;border-radius:9px;width:100%}
.choice:hover{border-color:var(--muted)}
.choice.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--surface))}
.choice.wrong{border-color:var(--rec);background:var(--rec-soft)}
.choice .k{font-family:var(--f-mono);font-weight:500;color:var(--muted)}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.stat{background:var(--surface);padding:14px 16px}
.stat b{display:block;font-family:var(--f-display);font-size:1.7rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:.8rem;color:var(--muted);font-weight:700}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;flex:1;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.hi i{background:var(--hi)}
.bar.bad i{background:var(--rec)}

/* chat */
.chat{display:flex;flex-direction:column;gap:14px}
.msg{max-width:78ch;padding:12px 14px;border-radius:12px;line-height:1.55}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.sys{align-self:center;font-size:.85rem;color:var(--muted)}
.ask-nav-portrait{width:22px;height:22px;object-fit:cover;border-radius:50%;background:var(--accent-soft);flex:none}
.ask-persona{display:flex;align-items:center;gap:12px;margin-top:14px;max-width:440px}
.ask-persona img{width:62px;height:62px;object-fit:contain;flex:none}
.ask-persona span{display:flex;flex-direction:column;gap:3px}
.ask-persona strong{font-size:.9rem}
.ask-persona small{color:var(--muted);font-size:.78rem;line-height:1.35}
.ask-reply{display:flex;align-items:flex-end;gap:8px;max-width:100%}
.ask-reply-avatar{width:34px;height:34px;flex:none;border-radius:50%;object-fit:cover;background:var(--accent-soft)}
.ask-reply .msg{max-width:min(78ch,calc(100% - 42px))}
.ask-answer-source{display:block;font-size:.73rem;font-weight:700;color:var(--muted);margin-bottom:5px}
.ask-send-avatar{width:22px;height:22px;object-fit:cover;border-radius:50%;background:var(--accent-soft)}
.companion-card-avatar{width:42px;height:42px;object-fit:cover;border-radius:50%;background:var(--accent-soft)}
.companion-persona{display:flex;align-items:center;gap:12px;margin-top:14px;max-width:440px}
.companion-persona img{width:62px;height:62px;object-fit:contain;flex:none}
.companion-persona span{display:flex;flex-direction:column;gap:3px}
.companion-persona strong{font-size:.9rem}
.companion-persona small{color:var(--muted);font-size:.78rem;line-height:1.35}
.practice-feedback{display:flex;align-items:flex-start;gap:10px;margin-top:10px}
.practice-feedback p{margin:2px 0 6px}
.composer{display:flex;gap:8px;align-items:flex-end;position:sticky;bottom:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:var(--shadow);margin-top:16px}
.composer textarea{flex:1;min-width:0;border:0;background:none;resize:none;min-height:44px;max-height:160px;padding:8px;outline:none}
.sugg{display:flex;gap:8px;flex-wrap:wrap}
.sugg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.86rem;text-align:left}
.sugg button:hover{border-color:var(--accent);color:var(--accent)}
.thinking{display:inline-flex;gap:4px;align-items:center;color:var(--muted);font-size:.9rem}
.thinking i{width:6px;height:6px;border-radius:50%;background:currentColor;animation:blink 1.2s infinite}
.thinking i:nth-child(2){animation-delay:.2s}.thinking i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* plans */
.plan{display:flex;flex-direction:column;gap:12px;min-width:0}
.plan .btn{white-space:normal;overflow-wrap:anywhere;text-align:center;line-height:1.4;min-height:44px;max-width:100%}
.plan .price{font-family:var(--f-display);font-size:2rem;font-weight:800}
.plan .price small{font-size:.9rem;color:var(--muted);font-weight:500;font-family:var(--f-body)}
.plan ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:5px;font-size:.92rem}
.plan.feature{border:2px solid var(--accent)}
.exam-access{display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin:8px 0 18px}

/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(8,14,12,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);border-radius:16px;width:min(640px,100%);max-height:88vh;overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:14px}
.modal.wide{width:min(820px,100%)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;font-size:.9rem;z-index:60;max-width:calc(100% - 32px)}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .main{padding-block:14px 110px}
  .mobile-contact{display:flex;justify-content:flex-end;margin-bottom:10px}
  .app[data-view="contact"] .mobile-contact{display:none}
  .mobile-contact a{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--accent);font:700 .85rem var(--f-body);text-decoration:none}
  .mobile-contact a svg{width:17px;height:17px}
  .mobile-contact a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .notes-grid{grid-template-columns:1fr}
  .notes-grid.has-sel .notes-list{display:none}
  .notes-list{position:static;max-height:none}
  .only-m{display:inline-flex}
  .tabbar button{min-width:0;padding:4px 4px;flex:1}
  .remind>div[style]{flex-basis:calc(100% - 70px)!important}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around}
  .tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.68rem;font-weight:700;color:var(--muted);padding:4px 3px;border-radius:8px;min-width:0}
  .tabbar button[aria-current="true"]{color:var(--accent)}
  .tabbar svg{width:22px;height:22px}
  .tabbar .recbtn svg{color:var(--rec)}
  .seg{grid-template-columns:50px minmax(0,1fr)}
  .seg .x{grid-column:2}
  .mark{margin-left:0}.slide{margin-left:0}
  .slide img{width:84px}
}

/* iPhone look on phones */
.recdisc{display:contents}
.exam-row{display:none}
.home-logo{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .home-logo .brand-mark{width:44px;height:44px;border-radius:11px;background:var(--logo);color:#fff;display:grid;place-items:center}
.home-logo .brand-mark svg{width:26px;height:26px}
.home-logo b{font-family:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;font-weight:800;font-size:1.7rem;letter-spacing:-.02em;color:var(--ink)}
@media (max-width:600px){
  :root{
    --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",system-ui,sans-serif;
    --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
    --radius:12px;
  }
  :root[data-theme]{--bg:var(--phone-bg)}
  html{-webkit-text-size-adjust:100%}
  body{font-size:17px;-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px)}
  .main{padding-inline:16px;padding-block:8px 120px}
  /* large titles */
  .page-h{margin-bottom:14px;gap:10px}
  .page-h h1,.lec-h h1{font-size:34px;line-height:41px;font-weight:700;letter-spacing:.2px}
  .page-h .sub{font-size:15px;margin-top:2px}
  .eyebrow{font-size:13px;letter-spacing:0;text-transform:none;font-weight:600}
  h2{font-size:20px}h3{font-size:17px;font-weight:600}
  /* search field */
  .topbar{margin-bottom:10px}
  .search{border:0;background:var(--surface-2);border-radius:10px;padding:0 8px;max-width:none}
  .search input{padding:8px 0;font-size:17px}
  /* inset grouped cards */
  .panel,.course-card,.q,.remind,.banner,.empty{border:0;border-radius:12px;box-shadow:none}
  .panel{padding:14px 16px}
  .course-card{border-top:0;flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:12px 16px}
  .course-card::before{content:"";width:30px;height:30px;border-radius:8px;background:var(--cc);flex:none}
  .course-card>div:nth-child(2){flex:1;min-width:0}
  .course-card .meta,.course-card>p{flex-basis:100%;padding-left:42px}
  .grid3,.grid2{gap:10px}
  .li{padding:11px 0}
  .banner{background:var(--surface);border-style:solid}
  .exam-row{display:flex;align-items:center;gap:12px;width:100%;border:0;background:var(--surface);border-radius:12px;padding:12px 16px;margin-top:14px;color:var(--ink);font-size:17px}
  .ios-ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
  .ios-ico svg{width:17px;height:17px}
  /* buttons & inputs (16px+ stops iOS zooming into fields) */
  .btn{border-radius:10px;min-height:44px;padding:10px 16px;font-weight:600;font-size:16px}
  .btn.sm{min-height:36px;padding:6px 12px;font-size:15px}
  .btn.ghost{color:var(--accent)}
  input.in,select.in,textarea.in,.composer textarea,.note-title{font-size:17px}
  input.in,select.in,textarea.in{border-radius:10px;padding:11px 12px}
  .check{border:0;background:var(--surface);border-radius:12px}
  /* tabs become a segmented control */
  .tabs{border:0;background:var(--surface-2);border-radius:9px;padding:2px;gap:0;margin-bottom:14px}
  .tabs button{flex:1 0 auto;border:0;margin:0;border-radius:7px;padding:7px 10px;font-size:13px;font-weight:600;color:var(--ink)}
  .tabs button[aria-selected="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.14);border:0}
  .seg-toggle{border:0;background:var(--surface-2);padding:2px;border-radius:9px}
  .seg-toggle button{border-radius:7px;background:transparent;color:var(--ink)}
  .seg-toggle button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
  /* tab bar with the red Record button in the middle */
  .tabbar{background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line);padding:7px 4px calc(4px + env(safe-area-inset-bottom,0px));align-items:flex-start}
   .tabbar button{font-size:10px;font-weight:600;gap:3px;color:var(--muted);padding:0;min-height:44px}
  .tabbar button[aria-current="true"]{color:var(--accent)}
  .tabbar svg{width:25px;height:25px}
  .tabbar .recbtn{color:var(--ink)}
  .tabbar .recdisc{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--rec);margin-top:-16px;box-shadow:0 4px 12px color-mix(in srgb,var(--rec) 40%,transparent)}
  .tabbar .recdisc svg{color:var(--rec-ink);width:23px;height:23px}
  .tabbar .recbtn.live .recdisc{animation:pulse 1.6s infinite}
  /* modals become bottom sheets */
  .scrim{place-items:end stretch;padding:0}
  .modal,.modal.wide{width:100%;max-height:92vh;border-radius:16px 16px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px))}
  .modal::before{content:"";align-self:center;width:36px;height:5px;border-radius:3px;background:var(--line);flex:none}
  /* recording, chat and notes */
  .recbar{border:0;border-radius:14px;top:calc(env(safe-area-inset-top,0px) + 4px)}
  .timer{font-size:1.9rem;font-weight:300}
  .composer{bottom:calc(92px + env(safe-area-inset-bottom,0px));border:0;border-radius:22px;padding:4px 4px 4px 12px}
  .composer .btn{border-radius:18px;min-height:36px}
  .msg{border-radius:18px;font-size:16px}
  .msg.me{border-bottom-right-radius:4px}.msg.ai{border:0;border-bottom-left-radius:4px}
  .note-body{background:var(--surface);border:0}
  .toast{border-radius:14px;bottom:calc(100px + env(safe-area-inset-bottom,0px))}
  .stat-row{border:0;border-radius:12px}
}

/* Home: a quiet, glanceable academic dashboard across all three views. */
.home{max-width:1120px;margin:0 auto;padding-bottom:32px}
.home button{min-height:44px}
.home .btn.sm{min-height:44px}
.home-mast{display:flex;align-items:center;gap:12px;margin-bottom:25px}
.home-mast .brand-mark{width:36px;height:36px;border-radius:11px}
.home-wordmark{font:800 1.18rem/1 var(--f-display);letter-spacing:-.035em}
.home-mast-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
.home-view{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 15px;color:var(--accent);font-weight:700;font-size:.86rem}
.credits-chip{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 12px;border:1px solid color-mix(in srgb,var(--accent) 28%,var(--line));border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:.82rem;font-weight:800;white-space:nowrap}
.credits-chip svg{width:17px;height:17px}
.home-avatar{width:44px;height:44px;border:0;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:800;font-family:var(--f-display)}
.home-intro{margin-bottom:22px}
.home-intro .eyebrow{margin-bottom:5px}
.home-intro h1{font-size:clamp(1.8rem,3.4vw,2.65rem)}
.home-intro p:last-child{color:var(--muted);font-size:.92rem;margin-top:5px}
.home-section{margin-top:25px}
.home-section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:11px}
.home-section-head h2{font-size:1.16rem}
.home-link{background:transparent;border:0;color:var(--accent);font-size:.84rem;font-weight:700;padding:0 6px}
.home-hero{background:var(--hero);color:var(--hero-ink);border-radius:20px;padding:22px 25px;display:flex;align-items:center;justify-content:space-between;gap:18px;min-height:150px}
.home-hero .kicker{font-size:.73rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--hero-ink)}
.home-hero h2{font-size:clamp(1.5rem,2.8vw,2.1rem);margin:6px 0}
.home-hero p{font-size:.9rem;color:var(--hero-ink)}
.home-hero .hero-record{background:var(--surface);color:var(--accent);border:0;border-radius:12px;padding:0 19px;font-weight:800;display:inline-flex;align-items:center;gap:9px;min-height:48px;white-space:nowrap}
.home-hero .hero-record svg{width:18px;height:18px;color:var(--rec)}
.home-hero.empty-schedule{background:var(--accent-soft);color:var(--ink)}
.home-hero.empty-schedule .kicker,.home-hero.empty-schedule p{color:var(--muted)}
.home-hero.empty-schedule .hero-record{background:var(--accent);color:var(--accent-ink)}
.home-hero.empty-schedule .hero-record svg{color:inherit}
.home-today{background:var(--surface);border-radius:17px;padding:4px 18px}
.home-class{display:grid;grid-template-columns:100px minmax(0,1fr) auto;align-items:center;gap:16px;min-height:70px;padding:10px 0;border-bottom:1px solid var(--line)}
.home-class:last-child{border-bottom:0}
.home-class-time{font:.78rem/1.35 var(--f-mono);color:var(--muted)}
.home-class-main{min-width:0}
.home-class-main b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.home-class-main small{display:block;color:var(--muted);font-size:.79rem;margin-top:2px}
.home-class-actions{display:flex;align-items:center;justify-content:flex-end;gap:7px}
.home-status{font-size:.7rem;letter-spacing:.025em;font-weight:800;color:var(--muted);border-radius:999px;background:var(--surface-2);padding:5px 9px;white-space:nowrap}
.home-status.now{background:var(--rec-soft);color:var(--ink)}
.home-status.next,.home-status.recorded{background:var(--accent-soft);color:var(--accent)}
.home-class .btn{min-height:44px}
.home-exams{display:flex;gap:8px;overflow-x:auto;padding:2px 0 5px;scrollbar-width:none}
.home-exam-chip{border:0;border-radius:11px;background:var(--hi-soft);color:var(--hi-ink);text-align:left;padding:9px 13px;font-size:.84rem;font-weight:700;white-space:nowrap}
.home-exam-chip span{opacity:.75;font-weight:500}
.home-actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.home-action{border:0;background:var(--surface);border-radius:14px;padding:14px 12px;text-align:left;font-weight:700;display:flex;align-items:center;gap:11px}
.home-action-icon,.home-tile-icon{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--accent)}
.home-action-icon svg,.home-tile-icon svg{width:19px;height:19px}
.home-action.record .home-action-icon,.home-tile.record .home-tile-icon{background:var(--rec-soft);color:var(--rec)}
.home-courses{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.home-course{border:0;background:var(--surface);border-radius:15px;padding:16px;text-align:left;min-height:116px;display:flex;flex-direction:column;gap:6px}
.home-course .course-code{font-size:.78rem;font-weight:800;color:var(--cc,var(--accent));letter-spacing:.02em}
.home-course b{font:700 1rem/1.25 var(--f-display)}
.home-course small{color:var(--muted);font-size:.8rem;margin-top:auto}
.home-course:before{content:"";height:3px;width:30px;border-radius:4px;background:var(--cc,var(--accent));margin-bottom:2px}
.home-add{border:1px dashed var(--line);background:transparent;color:var(--accent);justify-content:center;align-items:center;min-height:116px}
.home-utilities{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.home-utility{background:var(--surface);border-radius:15px;padding:14px 17px}
.home-utility h3{margin-bottom:5px}
.home-utility .li{min-height:48px}
.home-muted{color:var(--muted);font-size:.86rem}
.home-study-exams{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.home-study-exam{border:0;background:var(--surface);border-radius:16px;padding:18px;text-align:left;min-height:155px;display:flex;flex-direction:column;gap:8px}
.home-study-exam .count{font:800 2rem/1 var(--f-display);color:var(--hi-ink)}
.home-study-exam .count small{font:600 .8rem var(--f-body);margin-left:5px}
.home-study-exam .study-label{font-weight:800}
.home-study-exam .progress-track{height:6px;background:var(--surface-2);border-radius:10px;overflow:hidden;margin-top:auto}
.home-study-exam .progress-track i{display:block;height:100%;background:var(--accent);border-radius:10px}
.home-study-exam .detail{font-size:.76rem;color:var(--muted)}
.home-study-feature{background:var(--accent-soft);border-radius:16px;padding:17px 20px;display:flex;justify-content:space-between;align-items:center;gap:15px}
.home-study-feature p{font-size:.84rem;color:var(--muted);margin-top:3px}
.home-study-feature .btn{flex:none}

function inl(s){
  s=esc(s);
  s=s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\w)/g,'$1<em>$2</em>').replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\[\[([\w-]+)@(\d+(?:\.\d+)?)\]\]/g,(_,id,t,offset,whole)=>{
    const before=whole.slice(Math.max(0,offset-100),offset).replace(/<[^>]*>/g,'').replace(/\[\[.*?\]\]/g,'');
    const focus=(before.split(/[.!?]\s+/).filter(Boolean).pop()||before).replace(/[*#]/g,'').replace(/[.!?]\s*$/,'').trim().slice(-100);
    return citeChip(id,+t,focus)
  });
  s=s.replace(/\[\[NOTE:([\w-]+)\]\]/g,(_,id)=>noteCitationChip(id));
  s=s.replace(/\[\[ASSIGNMENT:([\w-]+)\]\]/g,(_,id)=>assignmentCitationChip(id));
  return s;
}
function md(src){
  if(!src)return'';
  const lines=String(src).replace(/\r/g,'').split('\n');let out='',list=null;
  const close=()=>{if(list){out+=`</${list}>`;list=null}};
  for(const raw of lines){
    const line=raw.trimEnd();let m;

      const message=response.status===409||response.status===503?setCreditsMaintenance(response.status):data.error||data.message||response.statusText||'This action could not be completed.';
      const error=Object.assign(new Error(message),data,{status:response.status});

  };
  const confirmedPayload=(quote)=>{
    const requestId=state.requestId||quote.requestId;
    const payload={...body,useCredits:true,requestId};

    if(options.includeQuotedCost)payload.cost=quote.cost;

  };

          if(!approved){if(state.useCredits)await refresh();throw Object.assign(new Error('You chose not to use credits for this action.'),{code:'credits_cancelled'})}
        }
        assertCurrent();
        if(!quote.requestId&&!state.requestId){if(state.useCredits)await refresh();throw Object.assign(new Error('The server did not provide a credit confirmation ID. Please try again.'),{code:'invalid_confirmation'})}
        if(state.requestId&&quote.requestId&&state.requestId!==quote.requestId){if(state.useCredits)await refresh();throw Object.assign(new Error('The credit quote changed. Retry this action to request a new confirmation.'),{code:'confirmation_changed'})}

          lastError=retryError;

          await refresh();
          if(retryError&&retryError.status===422&&retryError.code==='insufficient_credits')showInsufficientCredits(retryError,label);
          throw retryError;
        }
      }
      await refresh();throw lastError;
    }
    if(state.useCredits)await refresh();
    if(error&&error.status===422&&error.code==='insufficient_credits')showInsufficientCredits(error,label);
    throw error;
  }
}
function installCreditAwareTranscription(){

    const code=String(billingUserCode()||'');

    const audio=await new Promise((resolve,reject)=>{

      if(String(recordingId)!==String(sessionId))throw new Error('The recording and consent session IDs do not match.');
    }

      audio,filename:(timed?'lecture.':'question.')+ext,mime,timed,
      ...(consentId?{recordingId:String(recordingId),sessionId:String(sessionId),lectureId:String(lectureId),courseId:String(courseId),consentId:String(consentId)}:{})

function billingStatusText(status,showTranscriptionCount=true){

    ?` · ${recordingCount} of ${recordingLimit} saved recordings${showTranscriptionCount?` · ${transcriptionCount} of ${transcriptionLimit} successful transcriptions`:''}`: '';

/* stats: weak areas */
function record(cid,concept,ok,recordId,metadata){
  if(!cid||!concept)return false;
  const st=clone(statsOf(cid));st.id=cid;st.ex=!!(course(cid)||{}).ex;st.concepts=st.concepts||{};
  if(recordId){
    st.recorded=st.recorded||{};
    if(st.recorded[recordId])return false;
    st.recorded[recordId]=Date.now();
    const ids=Object.keys(st.recorded).sort((a,b)=>st.recorded[a]-st.recorded[b]);
    ids.slice(0,Math.max(0,ids.length-200)).forEach(id=>delete st.recorded[id]);
  }
  const k=String(concept).trim();if(!k)return false;
  const c=st.concepts[k]||{r:0,w:0};ok?c.r++:c.w++;c.last=Date.now();st.concepts[k]=c;
  if(metadata){st.attempts=st.attempts||[];st.attempts.push({at:Date.now(),concept:k,...metadata});if(st.attempts.length>80)st.attempts.splice(0,st.attempts.length-80)}
  put('stats',st);return true;
}

/* material for prompts */
function material(lecs,max=26000){
  let out='';
  for(const l of lecs){
    const a=l.analysis;const c=course(l.courseId)||{};
    let s=`\n### Lecture id=${l.id} · ${c.code||''} · ${l.date} · "${l.title}"\n`;
    if(a){
      s+=`Summary: ${a.summary||''}\nKey points:\n${(a.keyPoints||[]).map(k=>'- '+k).join('\n')}\n`;
      if(a.emphasized&&a.emphasized.length)s+=`Professor emphasized:\n${a.emphasized.map(e=>`- ${e.concept} (${e.why}) @${e.t}`).join('\n')}\n`;
      if(a.terms&&a.terms.length)s+=`Terms:\n${a.terms.map(t=>`- ${t.term}: ${t.def} @${t.t}`).join('\n')}\n`;
      if(a.examples&&a.examples.length)s+=`Examples/formulas:\n${a.examples.map(t=>`- [${t.kind}] ${t.text} @${t.t}`).join('\n')}\n`;
    }else{
      s+='Transcript:\n'+(l.segs||[]).map(g=>`[${Math.round(g.t)}] ${spkName(l,g.s)}: ${g.x}`).join('\n').slice(0,6000)+'\n';
    }
    if(l.myNotes)s+=`Student's own notes: ${l.myNotes.slice(0,1500)}\n`;
    Object.values(typeof allN==='function'?allN():{}).filter(n=>n.lectureId===l.id&&n.body).forEach(n=>{s+=`Student note "${n.title}": ${n.body.slice(0,1500)}\n`});
    if(out.length+s.length>max){out+='\n(Additional lectures omitted for length.)';break}
    out+=s;
  }
  return out;
}

function lectureText(l,what){
  const c=course(l.courseId)||{};const a=l.analysis||{};
  const head=`${c.code?c.code+' — ':''}${l.title}\n${fmtLong(l.date)}${c.professor?' · '+c.professor:''}\n\n`;
  const summary=()=>{
    let s='';
    if(a.summary)s+='SUMMARY\n'+a.summary+'\n\n';
    if(a.keyPoints&&a.keyPoints.length)s+='KEY POINTS\n'+a.keyPoints.map(k=>'• '+k).join('\n')+'\n\n';
    if(a.emphasized&&a.emphasized.length)s+='PROFESSOR EMPHASIZED\n'+a.emphasized.map(e=>`• ${e.concept} [${fmtT(e.t)}] — ${e.why}`).join('\n')+'\n\n';
    if(a.terms&&a.terms.length)s+='TERMS\n'+a.terms.map(t=>`• ${t.term}: ${t.def}`).join('\n')+'\n\n';
    if(a.assignments&&a.assignments.length)s+='ASSIGNMENTS MENTIONED\n'+a.assignments.map(x=>`• ${x.title}${x.due?' — due '+fmtD(x.due):''}`).join('\n')+'\n\n';
    if(a.announcements&&a.announcements.length)s+='ANNOUNCEMENTS\n'+a.announcements.map(x=>'• '+x).join('\n')+'\n\n';
    return s||'(No AI summary yet. Open the lecture and run Analyze.)\n\n';
  };
  const notes=()=>(a.notes?a.notes.replace(/\*\*/g,'')+'\n\n':'')+(l.myNotes?'MY NOTES\n'+l.myNotes+'\n\n':'');
  const tx=()=>'TRANSCRIPT\n'+(l.segs||[]).map(g=>`[${fmtT(g.t)}] ${spkName(l,g.s)}: ${g.x}`).join('\n')+'\n';
  if(what==='summary')return head+summary();
  if(what==='notes')return head+(notes()||'(No notes yet.)');
  if(what==='transcript')return head+tx();
  return head+summary()+notes()+tx();
}

function ics(items){

}

VIEWS.credits=()=>{
  const state=S.credits,data=state.data;

   const balancePanel=state.state==='ready'&&data?`<section class="credits-hero panel"><div class="credits-coin" aria-hidden="true">${ic('wave')}</div><div><p class="eyebrow">Your balance</p><h2>${creditNumber(data.balance)} <span>${esc(data.currency?.name||data.currencyCode||data.currency?.code||'Credits')}</span></h2><p class="small muted">Credits are linked to this library.</p></div></section>`:`<section class="panel credits-unavailable" role="${state.state==='error'?'alert':'status'}"><span class="credits-coin" aria-hidden="true">${ic('wave')}</span><div><h2>Balance unavailable</h2><p>${esc(message)}</p><button class="btn sm" data-act="creditsRetry">${state.state==='loading'?'Check again':'Retry'}</button></div></section>`;

  const cost=data?`<div class="grid2 credits-costs">${[['transcription10Minutes','10 minutes of transcription'],['savedRecording','Save a recording'],['studyGuide','Generate a study guide'],['askQuestion','Ask a question']].map(([key,label])=>`<div class="credits-cost-row"><span>${label}</span><b>${creditCostLabel(data.costs[key])}</b></div>`).join('')}</div>`:'<p class="small muted">Usage costs will appear when the server status is available.</p>';
   const history=data&&data.history.length?`<div class="list">${data.history.map(item=>{const amount=Number(item.amount),currencyMigration=amount===0&&/migrat/i.test(`${item.reason} ${item.source}`),date=item.date?new Date(item.date):null;const dateLabel=date&&!Number.isNaN(date.getTime())?date.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}):'Date unavailable';return`<div class="li credits-history-row"><div class="grow"><b>${currencyMigration?'Currency migration':esc(item.reason||'Credit activity')}</b><small class="small muted">${esc(dateLabel)}${item.source?` · ${esc(item.source)}`:''}</small></div><b class="${currencyMigration?'':amount<0?'credits-negative':'credits-positive'}">${currencyMigration?'No balance change':Number.isFinite(amount)?`${amount>0?'+':''}${creditNumber(Math.abs(amount))} credits`:'—'}</b></div>`}).join('')}</div>`:'<p class="small muted">No credit activity yet.</p>';
  return `<div class="page-h"><div><p class="eyebrow">Credits</p><h1>Keep learning, on your terms.</h1><p class="sub">A clear balance for the ClassScribe tools you choose to use.</p></div></div>

/* ---------- SEARCH ---------- */
function tokens(q){const stop=new Set('the a an and or of to in on for is was what did does do say said about this that with from how why when who which are be it as at by me my i you professor prof'.split(' '));return String(q).toLowerCase().replace(/[^a-z0-9′'\s-]/g,' ').split(/\s+/).filter(w=>w.length>1&&!stop.has(w))}
function scoreText(text,toks){const t=text.toLowerCase();let s=0;toks.forEach(w=>{const stem=w.length>5?w.slice(0,Math.max(5,w.length-2)):w;if(t.includes(stem))s+=1+(t.includes(w)?.5:0)});return s}
function searchSegs(q,cid,limit=8){
  const toks=tokens(q);if(!toks.length)return[];const hits=[];
  Object.values({...allL(),...S.shared}).forEach(l=>{if(cid&&l.courseId!==cid)return;(l.segs||[]).forEach((g,i)=>{const sc=scoreText(g.x,toks);if(sc>0)hits.push({l,i,g,sc})});(l.slides||[]).forEach(sl=>{const sc=scoreText(sl.text||'',toks);if(sc>0)hits.push({l,i:-1,g:{t:sl.t,s:'slide',x:sl.text},sc})})});
  return hits.sort((a,b)=>b.sc-a.sc||(b.l.date>a.l.date?1:-1)).slice(0,limit);
}
VIEWS.search=v=>{
  const q=v.q||'';const toks=tokens(q);
  const segs=searchSegs(q,null,30);
  const notes=[];Object.values(allL()).forEach(l=>{const a=l.analysis;if(!a)return;(a.terms||[]).forEach(t=>{if(scoreText(t.term+' '+t.def,toks))notes.push({l,t:t.t,title:t.term,x:t.def,kind:'Term'})});(a.keyPoints||[]).forEach(k=>{if(scoreText(k,toks))notes.push({l,t:0,title:l.title,x:k,kind:'Key point'})});if(l.myNotes&&scoreText(l.myNotes,toks))notes.push({l,t:0,title:l.title,x:l.myNotes.slice(0,140),kind:'My notes'})});
  const as=Object.values(allA()).filter(a=>scoreText(a.title,toks));
  const myn=Object.values(allN()).filter(n=>scoreText(n.title+' '+n.body,toks));
  const hl=s=>{let h=esc(s);toks.forEach(w=>{const stem=w.length>5?w.slice(0,Math.max(5,w.length-2)):w;h=h.replace(new RegExp('('+stem.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'[a-z]*)','gi'),'<mark style="background:var(--hi-soft);color:inherit;border-radius:3px">$1</mark>')});return h};
  return `<div class="page-h"><div><p class="eyebrow">Universal search</p><h1>“${esc(q)}”</h1><p class="sub">${segs.length+notes.length+as.length+myn.length} results across ${plural(Object.keys(allL()).length,'lecture')}</p></div><button class="btn primary" ${goAttr({name:'ask',prefill:q})}>${ic('chat')}Ask ClassScribe instead</button></div>
  <div class="stack">
  ${segs.length?`<section class="panel"><h3>In lectures</h3><div class="list" style="margin-top:6px">${segs.map(h=>`<button class="li" ${goAttr({name:'lecture',id:h.l.id,tab:'transcript',t:h.g.t})}><span class="mono muted" style="width:52px">${fmtT(h.g.t)}</span><span class="grow"><span class="small muted">${esc((course(h.l.courseId)||{}).code||h.l.code||'')} · ${fmtD(h.l.date)} · ${esc(h.l.title)}${h.g.s==='slide'?' · slide':''}</span><br>${hl(h.g.x)}</span></button>`).join('')}</div></section>`:''}
  ${notes.length?`<section class="panel"><h3>In notes and definitions</h3><div class="list" style="margin-top:6px">${notes.slice(0,20).map(n=>`<button class="li" ${goAttr({name:'lecture',id:n.l.id,tab:n.kind==='Term'?'terms':'notes'})}><span class="chip">${n.kind}</span><span class="grow"><b>${esc(n.title)}</b><br><span class="small">${hl(n.x)}</span></span></button>`).join('')}</div></section>`:''}
  ${myn.length?`<section class="panel"><h3>Your notes</h3><div class="list" style="margin-top:6px">${myn.map(n=>`<button class="li" ${goAttr({name:'notes',id:n.id})}><span class="chip">Note</span><span class="grow"><b>${esc(n.title||'Untitled note')}</b><br><span class="small">${hl(snippet(n.body,160))}</span></span></button>`).join('')}</div></section>`:''}
  ${as.length?`<section class="panel"><h3>Assignments</h3><div class="list">${as.map(a=>assignRow(a,true)).join('')}</div></section>`:''}
  ${!segs.length&&!notes.length&&!as.length&&!myn.length?'<div class="empty">No matches. Try a different word, or ask ClassScribe a question in your own words.</div>':''}
  </div>`;
};

ACT.billingCheckout=el=>{

ACT.billingConfirm=async el=>{
  if(el.disabled)return;
  const showStatus=message=>{const status=document.getElementById('billing-checkout-status');if(status)status.textContent=message};
  const plan=String(el.dataset.plan||'').toLowerCase();
  const blockReason=billingCheckoutBlockReason();
  if(blockReason){showStatus(blockReason);return}
  if(!['student','pro'].includes(plan)||!currentBillingStatus()?.billingReadiness?.ready){showStatus('Secure checkout is not ready. Close this confirmation and refresh the billing setup check.');return}
  let checkoutWindow=null;
  if(window.self!==window.top){
    checkoutWindow=window.open('about:blank','_blank');
    if(!checkoutWindow){showStatus('Your browser blocked the checkout tab. Allow pop-ups for this preview and try again.');return}
  }
  el.disabled=true;showStatus('Opening secure checkout…');
  try{if(await openBillingCheckout(plan,checkoutWindow))closeModal();else showStatus(S.billingNotice||'Checkout could not open. Please try again.')}
  catch(error){checkoutWindow?.close();showStatus(error.message||'Checkout could not open. Please try again.')}
  finally{el.disabled=false}
};

      <label class="f">Your name<input class="in" name="name" autocomplete="name" required maxlength="120"></label>

async function submitEduInquiry(form){
  if(form.dataset.pending==='1'||form.dataset.submitted==='1')return;
  const button=form.querySelector('[type="submit"]'),status=form.querySelector('[data-edu-status]');
  const inquiry=Object.fromEntries(['name','email','school','role','message'].map(key=>[key,form.elements.namedItem(key).value.trim()]));
  form.dataset.pending='1';button.disabled=true;status.textContent='Sending…';
  try{
    const response=await fetch('/api/edu-inquiries',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(inquiry)});
    const result=await response.json();
    if(!response.ok||result.accepted!==true)throw new Error('Inquiry was not accepted');
    form.dataset.submitted='1';
    // Count only provider-accepted inquiries, with no contact details or message.
    trackEvent('edu_inquiry_sent');
    // Update only the original form, never a newer dialog opened during delivery.
    if(form.isConnected)form.innerHTML='<div role="status" aria-live="polite"><p><b>Your inquiry was sent.</b></p><p>The ClassScribe EDU team will follow up at the email address you provided.</p></div><button type="button" class="btn primary" data-act="close">Done</button>';
  }catch{
    if(form.isConnected)status.textContent='We couldn’t send your inquiry right now. Please try again.';
  }finally{
    form.dataset.pending='0';
    if(form.dataset.submitted!=='1')button.disabled=false;
  }
}
document.addEventListener('submit',event=>{
  const form=event.target.closest('[data-form="eduInquiry"]');if(!form)return;
  event.preventDefault();void submitEduInquiry(form);
});

};

function pendingRecordingActionsKey(code){return`cs_pending_recording_actions_v1_${encodeURIComponent(code)}`}
function readPendingRecordingActions(code){try{return JSON.parse(localStorage.getItem(pendingRecordingActionsKey(code))||'[]')}catch(e){return[]}}
function writePendingRecordingActions(code,actions){try{localStorage.setItem(pendingRecordingActionsKey(code),JSON.stringify(actions));return true}catch(e){return false}}
function queueRecordingAction(action,recordingId,code){
  const actions=readPendingRecordingActions(code).filter(x=>x.recordingId!==recordingId);
  actions.push({action,recordingId:String(recordingId)});
  return writePendingRecordingActions(code,actions);
}
function clearQueuedRecordingAction(recordingId,code){
  return writePendingRecordingActions(code,readPendingRecordingActions(code).filter(x=>x.recordingId!==recordingId));

async function applyRecordingActionToLecture(recordingId,action){

  l.recordingReservationState=action==='finish'?'finished':'released';delete l.recordingReservationError;
  await put('lectures',l);
}
async function retryPendingRecordingActions(code=billingUserCode()){
  if(!code)return;
  const actions=readPendingRecordingActions(code);let changed=false;
  for(const pendingAction of actions){
    try{
      await billingRecordingAction(pendingAction.action,pendingAction.recordingId,code);
      await applyRecordingActionToLecture(pendingAction.recordingId,pendingAction.action);
      clearQueuedRecordingAction(pendingAction.recordingId,code);changed=true;
    }catch(e){}
  }
  if(changed)void loadBillingStatus(true,code);
}
async function releaseRecordingReservation(session,quiet=false){
  if(!session||!session.recordingId||!['reserved','release-pending'].includes(session.reservationState))return true;
  const code=session.billingCode||billingUserCode();session.reservationState='releasing';
  try{
    await billingRecordingAction('release',session.recordingId,code);
    clearQueuedRecordingAction(session.recordingId,code);
    session.reservationState='released';session.reservationError='';
    void loadBillingStatus(true,code);return true;
  }catch(error){
    session.reservationState='release-pending';session.reservationError=error.message||'Could not release the recording reservation.';
    queueRecordingAction('release',session.recordingId,code);

    if(S.view.name==='capture')render();return false;

async function finishRecordingReservation(lecture,session){

    clearQueuedRecordingAction(session.recordingId,session.billingCode||billingUserCode());
    lecture.recordingReservationState='finished';
    await put('lectures',lecture);
    void loadBillingStatus(true,session.billingCode||billingUserCode());
  }catch(error){
    lecture.recordingReservationError=error.message||'Could not confirm the saved recording.';

    void loadBillingStatus(true,session.billingCode||billingUserCode());

  }
}

function hms(s){const p=String(s).trim().replace(',','.').split(':').map(Number);return p.reduce((a,b)=>a*60+b,0)}
function spkCode(n){n=n.toLowerCase();if(/prof|dr\.?|instructor|teacher|lecturer/.test(n))return'P';if(/student|q\b|question/.test(n))return'S';return'G'}
function parseTranscript(text,baseT){
  const out=[];let t=baseT;
  if(/-->/.test(text)){
    text.replace(/\r/g,'').split(/\n\s*\n/).forEach(b=>{const ls=b.split('\n').filter(Boolean);const i=ls.findIndex(x=>x.includes('-->'));if(i<0)return;const st=hms(ls[i].split('-->')[0]);let body=ls.slice(i+1).join(' ');let s='P';const v=body.match(/<v\s+([^>]+)>/);if(v){s=spkCode(v[1])}body=body.replace(/<[^>]+>/g,'').trim();const m=body.match(/^([A-Z][\w .'’-]{0,30}):\s+(.*)/);if(m){s=spkCode(m[1]);body=m[2]}if(body)out.push({t:st,s,x:body})});
    return out;
  }
  text.split('\n').forEach(raw=>{let x=raw.trim();if(!x)return;let s='P';const m=x.match(/^\[?((?:\d{1,2}:)?\d{1,2}:\d{2})\]?\s*[-–]?\s*/);if(m){t=hms(m[1]);x=x.slice(m[0].length)}else{t+=out.length?8:0}
    const n=x.match(/^([A-Z][\w .'’-]{0,30}):\s+(.*)/);if(n){s=spkCode(n[1]);x=n[2]}out.push({t,s,x})});
  return out;
}
async function makeThumb(file){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});const w=360,h=Math.round(img.height*w/img.width);const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);return cv.toDataURL('image/jpeg',.7)}catch(e){return''}finally{URL.revokeObjectURL(url)}
}
async function onSlide(file){

    const r=await CS_STUDY('slide',{material:'Lecture slide',image:{mediaType:file.type,data:String(encoded).split(',')[1]}});sl.text=r.text.trim()}

  if(SES)refreshLive();
}
async function onImport(file){
  const text=await file.text();const lines=parseTranscript(text,nowT());if(!lines.length){toast('No transcript lines found in that file.');return}
  lines.forEach(l=>SES.segs.push({t:l.t,s:l.s,x:l.x}));SES.segs.sort((a,b)=>a.t-b.t);
  const last=SES.segs[SES.segs.length-1].t;if(last>nowT()){SES.acc=last*1000;SES.resumeAt=Date.now()}
  refreshLive();toast(`Imported ${plural(lines.length,'line')}`);
}

    MIC.rec=null;MIC.stream=null;MIC.sharedStream=null;MIC.state='off';MIC.captions=false;

async function ensureLectureTranscriptionConsent(savedLecture){
  const validId=id=>typeof id==='string'&&/^[0-9a-f]{8}-[0-9a-f-]{27}$/i.test(id);
  const existingRecordingId=String(savedLecture.consentRecordingId||savedLecture.id);

  if(!savedLecture.id||!savedLecture.courseId)throw new Error('This saved audio is missing its lecture or course identity.');
  const config=PRIVACY_CONFIG||await loadPrivacyConfig();
  const code=privacyLibraryCode(),key=transcriptionConsentDraftKey(code,savedLecture.id);
  let previous=null;
  try{
    previous=JSON.parse(localStorage.getItem(key)||'null');
    if(!previous||previous.lectureId!==savedLecture.id||previous.courseId!==savedLecture.courseId||previous.version!==config.consent.version||JSON.stringify(previous.statements)!==JSON.stringify(config.consent.statements)){previous=null;localStorage.removeItem(key)}
  }catch(e){previous=null}
  const recordingId=previous&&previous.sessionId||uid();
  const approval=await requestLectureTranscriptionConsent(savedLecture,config.consent.statements,!!(previous&&previous.accommodation));
  if(!approval)return null;
  const record={
    consentId:previous&&previous.consentId||'consent-'+uid(),
    sessionId:recordingId,lectureId:String(savedLecture.id),courseId:String(savedLecture.courseId),
    version:config.consent.version,statements:[...config.consent.statements],platform:'web',
    appVersion:window.CS_APP_VERSION||'web-0.0.0',accommodation:!!approval.accommodation
  };

  catch(e){throw new Error('Could not save the permission record in this browser. Audio was not sent.')}
  const persisted=await persistRecordingConsent(record,code);
  if(persisted.queued)throw new Error('Permission is saved on this device. Connect to the internet so it can be uploaded before transcription.');
  record.consentId=persisted.consentId;
  try{localStorage.setItem(key,JSON.stringify(record))}
  catch(e){throw new Error('Permission was saved, but its receipt could not be retained on this device. Audio was not sent.')}
  const current=lecture(savedLecture.id)||savedLecture;
  await put('lectures',{...current,consentId:record.consentId,sessionId:record.sessionId,consentRecordingId:record.sessionId});
  try{localStorage.removeItem(key)}catch(e){}
  return{consentId:record.consentId,recordingId:record.sessionId,sessionId:record.sessionId,lectureId:record.lectureId,courseId:record.courseId};
}

async function writePrivateSource(note,scope){
  if(!scope||note.courseId!==scope.courseId||!privateSourceScopeIsCurrent(scope))throw new Error('The active library or course changed. No source was saved; reopen the importer in the intended library.');
  if(isExampleRecord('notes',note))throw new Error('Example course sources are read-only.');
  if(scope.mode==='db'){
    if(!scope.uid||!DB||typeof DB.doc!=='function')throw new Error('The signed-in library is unavailable. No source was saved.');
    await DB.doc('data/users/'+scope.uid+'/lib').collection('notes').doc(note.id).set(clone(note));
    if(!privateSourceScopeIsCurrent(scope))return false;
    S.notes[note.id]=note;schedule();return true;
  }
  if(scope.mode==='local'){
    const notes={...S.notes,[note.id]:note};
    const library=Object.fromEntries(COLS.map(c=>[c,c==='notes'?notes:S[c]]));
    localStorage.setItem('cs_lib',JSON.stringify(library));

  }
  throw new Error('This library cannot save private sources.');
}

document.addEventListener('submit',async e=>{
  const form=e.target.closest('[data-form="importSource"]');if(!form)return;e.preventDefault();
  const courseId=$('#source-course').value,type=$('#source-type').value,file=$('#source-file').files[0],paste=$('#source-text').value;
   const titleInput=$('#source-title'),status=$('#source-import-status'),submit=$('#source-import-submit'),analyze=$('#source-analyze')?.checked!==false;
   if(submit?.disabled)return;
  if(!courseId||!course(courseId)||course(courseId).ex){status.textContent='Choose one of your own courses.';return}
  if(!SOURCE_NOTE_TYPES.includes(type)){status.textContent='Choose a supported source type.';return}
  if(file&&paste.trim()){status.textContent='Choose either a file or pasted text, not both.';return}
  const scope=capturePrivateSourceScope(courseId);
  let body=paste,sourceName='',sourceTruncated=false;
  if(file){
    const ext=file.name.toLowerCase().split('.').pop();
    if(!['pdf','txt','md'].includes(ext)){status.textContent='Choose a PDF, TXT, or MD file.';return}
    if(file.size>8*1024*1024){status.textContent='Files must be 8 MB or smaller.';return}
    if(ext==='pdf'&&file.type&&file.type!=='application/pdf'){status.textContent='The selected PDF has an unexpected file type.';return}
    if(ext!=='pdf'&&file.type&&file.type!=='text/plain'&&file.type!=='application/octet-stream'){status.textContent='TXT and MD files must be plain text.';return}
    const code=billingUserCode();if(!code){status.textContent='Sign in to your library before importing a file.';return}
    if(submit)submit.disabled=true;status.textContent='Extracting text…';
    try{
      const response=await fetch('/api/materials/extract',{method:'POST',headers:{'X-CS-User':code,'Content-Type':ext==='pdf'?'application/pdf':'text/plain'},body:file});
      const data=await response.json().catch(()=>null);
      if(!response.ok)throw new Error(data&&data.error||`Text extraction failed (${response.status}).`);
      if(!data||typeof data.text!=='string'||typeof data.truncated!=='boolean'||!Number.isFinite(data.originalLength))throw new Error('Text extraction returned an invalid response.');
       if(!privateSourceImporterIsCurrent(scope,form)){if(submit)submit.disabled=false;status.textContent='Your active library or course changed during extraction. Nothing was saved; reopen the importer in the intended library.';return}
      body=data.text;sourceName=file.name;sourceTruncated=data.truncated;
      if(data.truncated)status.textContent=`The extracted source was truncated (${data.originalLength.toLocaleString()} original characters). Review the saved text before using it.`;
    }catch(error){if(submit)submit.disabled=false;status.textContent=error.message||'Text extraction failed. Try again.';return}
  }
  if(!body.trim()){if(submit)submit.disabled=false;status.textContent='Paste text or choose a file with extractable text.';return}
  const wasLong=body.length>30000;body=body.slice(0,30000);
  const now=Date.now(),id=uid(),title=(titleInput.value.trim()||sourceName.replace(/\.[^.]+$/,'')||({syllabus:'Syllabus',reading:'Reading', 'study-guide':'Study guide'}[type])).slice(0,200);
  const note={id,courseId,lectureId:'',title,body,sourceType:type,...(sourceName?{sourceName}:{}),created:now,updated:now,pinned:false};
  let savedInActiveLibrary;
  if(!privateSourceImporterIsCurrent(scope,form)){if(submit)submit.disabled=false;status.textContent='Your active library or course changed before saving. Nothing was saved; reopen the importer in the intended library.';return}
   try{
     if(submit)submit.disabled=true;
     if(analyze){
       status.textContent='Analyzing document and extracting key points…';
       note.sourceAnalysis=await CS_STUDY('source-summary',{material:body});
       if(typeof note.sourceAnalysis?.summary!=='string'||!Array.isArray(note.sourceAnalysis?.keyPoints))throw new Error('Document analysis returned an invalid response. Please try again.');
       if(!privateSourceImporterIsCurrent(scope,form))throw new Error('Your library or course changed during analysis. Nothing was saved; reopen the importer.');
     }
     savedInActiveLibrary=await writePrivateSource(note,scope);
   }
  catch(error){if(submit)submit.disabled=false;status.textContent='Couldn’t save the private source: '+(error&&error.message||'please try again.');return}
  if(!savedInActiveLibrary||!privateSourceImporterIsCurrent(scope,form)){if(submit)submit.disabled=false;status.textContent='Source saved to the original private library, but the active library or course changed while saving. No other library was modified; switch back to view it.';return}
  closeModal();NOTE_UI.mode='write';go({name:'notes',courseId,id});
   toast((analyze?'Summary and key points ready. ':'')+(wasLong||sourceTruncated?'Source saved with truncated text; review it before using it.':scope.mode==='db'?'Private source saved and synced to this library.':'Private source saved in this browser.'));
});

function privacyEscrowKey(code){return'cs_privacy_consent_queue_v1_'+encodeURIComponent(code||'local')}

function writePrivacyConsentQueue(items,code=privacyLibraryCode()){
  try{localStorage.setItem(privacyEscrowKey(code),JSON.stringify(items));return true}catch(e){return false}
}
function queuePrivacyConsent(record,code=privacyLibraryCode()){
  const rows=readPrivacyConsentQueue(code).filter(item=>item.sessionId!==record.sessionId);
  rows.push(record);return writePrivacyConsentQueue(rows,code);

async function persistRecordingConsent(record,code=privacyLibraryCode()){
  if(!writePrivacyConsentQueue([...readPrivacyConsentQueue(code).filter(item=>item.sessionId!==record.sessionId),record],code))throw new Error('Could not save consent in this browser. Recording did not start.');
  if(!navigator.onLine)return {queued:true};
  const submission={...record};delete submission.consentId;
  const result=await privacyRequest('/consents','POST',submission,code);
  const consentId=String(result.consentId||result.id||'');
  if(!/^[0-9a-f]{8}-[0-9a-f-]{27}$/i.test(consentId))throw new Error('The consent service did not return a valid consent ID. Recording did not start.');
  record.consentId=consentId;
  writePrivacyConsentQueue(readPrivacyConsentQueue(code).filter(item=>item.sessionId!==record.sessionId),code);
  return {queued:false,consentId};
}
async function flushPrivacyConsentQueue(code=privacyLibraryCode()){
  const requestCode=code;
  for(const record of readPrivacyConsentQueue(code)){
    if(requestCode!==privacyLibraryCode())return;
    try{
      const submission={...record};delete submission.consentId;
      await privacyRequest('/consents','POST',submission,requestCode);
      writePrivacyConsentQueue(readPrivacyConsentQueue(requestCode).filter(item=>item.sessionId!==record.sessionId),requestCode);
    }catch(e){return}
  }
}

function privacyFirstFactorAgeMinutes(session){

async function ensurePrivacyFreshFirstFactor(){
  const session=clerkClient&&clerkClient.session;
  if(!session||typeof session.startVerification!=='function')throw new Error('This Clerk session cannot reverify your identity. Sign out and sign in again before deleting.');
  let verification=await session.startVerification({level:'first_factor'});
  if(verification.status==='complete')return;
  const factors=verification.supportedFirstFactors||[];
  const password=factors.find(f=>f.strategy==='password');
  const email=factors.find(f=>f.strategy==='email_code');
  if(password){
    const secret=await privacyPromptSecret('Verify your password','Password','password');
    if(secret===null)throw new Error('Identity verification was cancelled. Your library was not deleted.');
    verification=await session.attemptFirstFactorVerification({strategy:'password',password:secret});
  }else if(email){
    verification=await session.prepareFirstFactorVerification({strategy:'email_code',emailAddressId:email.emailAddressId});
    const code=await privacyPromptSecret('Check your email for a verification code','Verification code','text');
    if(code===null)throw new Error('Identity verification was cancelled. Your library was not deleted.');
    verification=await session.attemptFirstFactorVerification({strategy:'email_code',code});
  }else{
    throw new Error('Clerk has no supported first-factor method for this session. Sign out and sign in again before deleting.');
  }
  if(verification.status!=='complete')throw new Error('Clerk could not verify a fresh first factor. Your library was not deleted.');
  if(privacyFirstFactorAgeMinutes(verification.session)>10)throw new Error('Clerk did not confirm a first-factor verification within the last 10 minutes. Your library was not deleted.');
  session.clearCache();
  const token=await session.getToken({skipCache:true});
  if(!token)throw new Error('A fresh first-factor session token could not be obtained. Your library was not deleted.');
}

function profilePhotoLocalStore(action,key,value){
  if(!window.indexedDB)return Promise.reject(new Error('This browser does not support IndexedDB, so profile photos cannot be saved locally.'));
  return new Promise((resolve,reject)=>{
    const open=indexedDB.open(PROFILE_PHOTO_LOCAL_DB,1);
    let settled=false;
    const fail=(message,db)=>{
      if(settled)return;
      settled=true;
      if(db)db.close();
      reject(new Error(message));
    };
    open.onupgradeneeded=()=>{
      const db=open.result;
      if(!db.objectStoreNames.contains('photos'))db.createObjectStore('photos');
    };
    open.onerror=()=>fail('Could not open local photo storage. Your photo was not changed.');
    open.onblocked=()=>fail('Local photo storage is busy in another tab. Close other ClassScribe tabs and try again.');
    open.onsuccess=()=>{
      const db=open.result;
      if(settled){db.close();return}
      let transaction;
      try{
        transaction=db.transaction('photos',action==='get'?'readonly':'readwrite');
        const store=transaction.objectStore('photos');
        const request=action==='get'?store.get(key):action==='put'?store.put(value,key):store.delete(key);
        let result;
        request.onsuccess=()=>{result=request.result};
        transaction.oncomplete=()=>{if(settled)return;settled=true;db.close();resolve(result)};
        transaction.onerror=()=>fail('Local photo storage failed. Your previous photo was kept.',db);
        transaction.onabort=()=>fail('Local photo storage was interrupted. Your previous photo was kept.',db);
      }catch(error){fail('Local photo storage is unavailable. Your previous photo was kept.',db)}
    };
  });
}
async function validateProfilePhotoDecode(file){
  let temporaryUrl=null;
  try{
    if(typeof window.createImageBitmap==='function'){
      const bitmap=await createImageBitmap(file);
      const valid=bitmap.width>0&&bitmap.height>0&&bitmap.width*bitmap.height<=40000000;
      bitmap.close();
      if(!valid)throw new Error('Choose an image with valid dimensions under 40 megapixels.');
      return;
    }
    temporaryUrl=URL.createObjectURL(file);
    const image=new Image();
    image.src=temporaryUrl;
    if(typeof image.decode==='function')await image.decode();
    else await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=reject});
    if(!image.naturalWidth||!image.naturalHeight||image.naturalWidth*image.naturalHeight>40000000)throw new Error('Choose an image with valid dimensions under 40 megapixels.');
  }catch(error){
    throw error&&error.message?error:new Error('This file could not be decoded as an image. Choose a valid JPEG, PNG, or WebP.');
  }finally{if(temporaryUrl)URL.revokeObjectURL(temporaryUrl)}
}

async function uploadLocalProfilePhoto(file){

    await validateProfilePhotoDecode(file);

    profilePhotoLocalNoticeRequest++;

  }catch(error){
    if(!profilePhotoRequestIsActive(request,scopeKey,'local')){if(previewUrl)URL.revokeObjectURL(previewUrl);return}
    if(previewUrl)URL.revokeObjectURL(previewUrl);
    PROFILE_PHOTO_URL=oldUrl;
    paintProfilePhoto();
    setProfilePhotoStatus(error.message||'Could not save your photo in this browser. Your previous photo was kept.','error');
  }finally{
    if(request===profilePhotoRequest){
      profilePhotoBusy=false;
      if(pick)pick.disabled=false;
      if(remove)remove.disabled=false;
      if(profilePhotoRequestIsActive(request,scopeKey,'local'))syncProfilePhotoScope();
    }
  }
}

function applyRemoteProfile(uid,remote){
  if(uid!==S.uid)return;
  const pending=pendingProfilePatch(uid);
  let next=remote?{...remote,...pending}:Object.keys(pending).length?{...pending}:null;
  const guard=exampleChoiceGuard[uid];
  if(guard&&!Object.prototype.hasOwnProperty.call(pending,'showExamples')&&remote&&typeof remote.showExamples==='boolean'){
    const remoteChoiceAt=Number(remote.showExamplesUpdated)||0;
    if(remote.showExamples===guard.show&&remoteChoiceAt>=guard.updated)delete exampleChoiceGuard[uid];
    else if(remoteChoiceAt<=guard.updated)next={...(next||{}),showExamples:guard.show,showExamplesUpdated:guard.updated};
    else delete exampleChoiceGuard[uid];
  }
  applyAppearancePreference(next);
  applyExamplePreference(next);
  if(JSON.stringify(next)===JSON.stringify(S.profile))return;
  S.profile=next;
  if(next)persistProfileLocal(next);
  paintHomeLayoutChoices();
  paintAppearanceChoices();
  if(S.view.name==='home'||S.view.name==='account')render();
}
function watchProfile(uid){
  if(S.mode!=='db'||!uid||profileWatchUid===uid)return;

  profileWatchUid=uid;

}
function persistProfileLocal(p){
  try{
    if(S.mode==='db'&&S.uid)localStorage.setItem(profileCacheKey(S.uid),JSON.stringify(p));
    else localStorage.setItem('cs_profile',JSON.stringify(p));
  }catch(e){}
}
function pendingProfilePatch(uid){
  if(profilePending[uid])return profilePending[uid];
  try{profilePending[uid]=JSON.parse(localStorage.getItem(pendingProfileKey(uid))||'{}')}catch(e){profilePending[uid]={}}
  if(!profilePending[uid]||typeof profilePending[uid]!=='object'||Array.isArray(profilePending[uid]))profilePending[uid]={};
  return profilePending[uid];
}
async function flushProfilePatches(uid=S.uid){
  if(S.mode!=='db'||!uid)return;
  const run=async()=>{
    while(S.mode==='db'&&uid===S.uid){
      const pending=pendingProfilePatch(uid),keys=Object.keys(pending);
      if(!keys.length)return;
      const batch={...pending};
      await DB.doc('data/users/'+uid+'/profile').update(batch);
      const latest=pendingProfilePatch(uid);
      Object.keys(batch).forEach(k=>{if(Object.prototype.hasOwnProperty.call(latest,k)&&JSON.stringify(latest[k])===JSON.stringify(batch[k]))delete latest[k]});
      try{localStorage.setItem(pendingProfileKey(uid),JSON.stringify(latest))}catch(e){}
      const merged={...(S.profile||{})};
      Object.keys(batch).forEach(k=>{if(!Object.prototype.hasOwnProperty.call(latest,k))merged[k]=batch[k]});
      if(S.uid===uid){S.profile=merged;persistProfileLocal(merged)}
    }
  };
  const task=profileWriteQueue.catch(()=>{}).then(run);
  profileWriteQueue=task.catch(()=>{});
  return task;
}
async function queueProfilePatch(patch){
  const clean={...patch,updated:Date.now()};
  if(Object.prototype.hasOwnProperty.call(clean,'showExamples'))exampleChoiceGuard[S.uid||'local']={show:!!clean.showExamples,updated:Number(clean.showExamplesUpdated)||clean.updated};
  S.profile={...(S.profile||{}),...clean};
  applyAppearancePreference(S.profile);
  applyExamplePreference(S.profile);
  persistProfileLocal(S.profile);
  if(S.mode!=='db')return;
  const uid=S.uid,pending=pendingProfilePatch(uid);
  Object.assign(pending,clean);
  try{localStorage.setItem(pendingProfileKey(uid),JSON.stringify(pending))}catch(e){}
  await flushProfilePatches(uid);
}

  const {homeLayout,appearance,showExamples,showExamplesUpdated,...profileFields}=patch;
  return queueProfilePatch(profileFields);
}
window.CS_FLUSH_PROFILE_PATCHES=async uid=>flushProfilePatches(uid||S.uid);
window.CS_MOVE_PROFILE_PATCHES=(fromUid,toUid)=>{
  if(!fromUid||!toUid)return;
  const source=pendingProfilePatch(fromUid);
  if(!Object.keys(source).length)return;
  const target=pendingProfilePatch(toUid);
  Object.assign(target,source);
  localStorage.setItem(pendingProfileKey(toUid),JSON.stringify(target));
  const oldCache=JSON.parse(localStorage.getItem(profileCacheKey(fromUid))||'null')||{};
  localStorage.setItem(profileCacheKey(toUid),JSON.stringify({...oldCache,...source}));
  profilePending[toUid]=target;
  delete profilePending[fromUid];
  localStorage.removeItem(pendingProfileKey(fromUid));
};

  if(S.mode==='db'&&uid){try{local=JSON.parse(localStorage.getItem(profileCacheKey(uid))||'null')||local}catch(e){}}

  let remote=null;
  try{
    const snap=await DB.doc('data/users/'+uid+'/profile').get();
    if(snap.exists)remote=snap.data();
  }catch(e){}
  if(uid!==S.uid)return;

  }

function initClerkAccount(){

    widget.innerHTML=`<a class="btn primary" target="_blank" rel="noopener" href="${esc(clerkAccountPageUrl())}">Open sign-in in a new tab</a>`;

  }
  const config=window.CS_CLERK_CONFIG||{};
  if(!config.publishableKey){
    clerkAccountMessage('Optional account sign-in is not configured in this build. Your sync code and library remain available as usual.');
    return;
  }
  if(clerkLoad){
    clerkLoad.then(refreshClerkAccount).catch(error=>{

      clerkAccountMessage('Your sync code and library remain available as usual.');

      return;
